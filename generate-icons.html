<!DOCTYPE html>
<html>
<head>
<title>FullTime Icon Generator</title>
<style>body{font-family:sans-serif;padding:20px;background:#07090a;color:#e8edf2}.btn{background:#00e96b;color:#07090a;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:700;font-size:1rem;margin:8px 4px}.grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}</style>
</head>
<body>
<h2 style="color:#00e96b">FullTime Icon Generator</h2>
<p>Click the button to generate and download all required PWA icons.</p>
<button class="btn" onclick="generateAll()">Generate & Download All Icons</button>
<div class="grid" id="grid"></div>
<script>
const sizes=[72,96,128,144,152,192,384,512];

function drawIcon(size){
  const c=document.createElement('canvas');
  c.width=c.height=size;
  const ctx=c.getContext('2d');
  const pad=size*0.08;
  const r=size*0.22;

  // Background
  ctx.fillStyle='#07090a';
  ctx.beginPath();
  ctx.roundRect(0,0,size,size,r);
  ctx.fill();

  // Green circle
  ctx.fillStyle='#00e96b';
  ctx.beginPath();
  ctx.arc(size/2,size/2,size*0.42,0,Math.PI*2);
  ctx.fill();

  // Football star shape
  ctx.fillStyle='#07090a';
  const cx=size/2, cy=size/2, outerR=size*0.28, innerR=size*0.13;
  const points=5;
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const angle=(i*Math.PI/points)-Math.PI/2;
    const radius=i%2===0?outerR:innerR;
    const x=cx+Math.cos(angle)*radius;
    const y=cy+Math.sin(angle)*radius;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();

  // Inner green circle
  ctx.fillStyle='#00e96b';
  ctx.beginPath();
  ctx.arc(cx,cy,size*0.1,0,Math.PI*2);
  ctx.fill();

  return c;
}

function generateAll(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  sizes.forEach(size=>{
    const c=drawIcon(size);
    grid.appendChild(c);
    // Download
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download=`icon-${size}.png`;
    a.click();
  });
  alert('All '+sizes.length+' icons downloaded!\n\nCreate a folder called "icons" on your hosting and upload them all there.');
}
</script>
</body>
</html>
