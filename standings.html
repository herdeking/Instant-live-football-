<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Standings — FullTime</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e96b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<script>(function(d,z,s){s.src='https://'+d+'/400/'+z;try{(document.body||document.documentElement).appendChild(s)}catch(e){}})('gizokraijaw.net',3325630,document.createElement('script'))</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:12px 14px;border-bottom:1px solid var(--bd)}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px}
.league-picker{display:flex;overflow-x:auto;gap:8px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.league-picker::-webkit-scrollbar{display:none}
.lpick{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:60px}
.lpick img{width:26px;height:26px;object-fit:contain;border-radius:50%;background:var(--s2)}
.lpick span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.2}
.lpick.active{background:rgba(0,233,107,.08);border-color:rgba(0,233,107,.4);color:var(--g)}
.lpick.active img{box-shadow:0 0 0 2px var(--g)}
.frame-wrap{width:100%}
.st-frame{width:100%;border:none;display:block;height:calc(100vh - 180px)}
.btn-links{display:flex;flex-direction:column;gap:10px;padding:20px 14px;max-width:340px;margin:0 auto}
.ext-btn{display:block;text-align:center;padding:13px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none}
.btn-primary{background:var(--g);color:var(--bg)}
.btn-secondary{background:var(--s2);color:var(--t1);border:1px solid var(--bd)}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">FULL<span>TIME</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="livescores.html">Live Scores</a>
    <a href="fixtures.html">Fixtures</a>
    <a href="standings.html" class="active">Standings</a>
  </div>
</nav>
<div class="page-header">
  <div class="page-title">Standings</div>
</div>
<div class="league-picker" id="league-picker"></div>
<div class="frame-wrap" id="fw">
  <iframe class="st-frame" id="stf" src="" scrolling="yes" allow="autoplay;fullscreen" loading="lazy"></iframe>
</div>
<nav class="bottom-nav">
  <a class="bn-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
  <a class="bn-item" href="livescores.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg><span>Live</span></a>
  <a class="bn-item" href="fixtures.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Fixtures</span></a>
  <a class="bn-item active" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>
<script>
const LB='https://media.api-sports.io/football/leagues/';
const LEAGUES=[
  {name:'Premier League',logo:LB+'39.png',url:'https://www.flashscore.com/football/england/premier-league/standings/'},
  {name:'La Liga',logo:LB+'140.png',url:'https://www.flashscore.com/football/spain/laliga/standings/'},
  {name:'Serie A',logo:LB+'135.png',url:'https://www.flashscore.com/football/italy/serie-a/standings/'},
  {name:'Bundesliga',logo:LB+'78.png',url:'https://www.flashscore.com/football/germany/bundesliga/standings/'},
  {name:'Ligue 1',logo:LB+'61.png',url:'https://www.flashscore.com/football/france/ligue-1/standings/'},
  {name:'UCL',logo:LB+'2.png',url:'https://www.flashscore.com/football/europe/champions-league/standings/'},
  {name:'Europa',logo:LB+'3.png',url:'https://www.flashscore.com/football/europe/europa-league/standings/'},
  {name:'Eredivisie',logo:LB+'88.png',url:'https://www.flashscore.com/football/netherlands/eredivisie/standings/'},
  {name:'Portugal',logo:LB+'94.png',url:'https://www.flashscore.com/football/portugal/liga-portugal/standings/'},
  {name:'Championship',logo:LB+'40.png',url:'https://www.flashscore.com/football/england/championship/standings/'},
];

// Fallback to livescore.com
const FALLBACK_LEAGUES=[
  'https://www.livescore.com/en/football/england/premier-league/',
  'https://www.livescore.com/en/football/spain/laliga/',
  'https://www.livescore.com/en/football/italy/serie-a/',
  'https://www.livescore.com/en/football/germany/bundesliga/',
  'https://www.livescore.com/en/football/france/ligue-1/',
  'https://www.livescore.com/en/football/europe/champions-league/',
  'https://www.livescore.com/en/football/europe/europa-league/',
  'https://www.livescore.com/en/football/netherlands/eredivisie/',
  'https://www.livescore.com/en/football/portugal/liga-portugal/',
  'https://www.livescore.com/en/football/england/championship/',
];

let curIdx=0;

function buildPicker(){
  document.getElementById('league-picker').innerHTML=LEAGUES.map((l,i)=>`
    <button class="lpick${i===0?' active':''}" onclick="selectLeague(${i},this)">
      <img src="${l.logo}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(l.name.substring(0,2))}&background=1a2330&color=8a9ab0&size=60'">
      <span>${l.name}</span>
    </button>`).join('');
}

function selectLeague(idx,btn){
  curIdx=idx;
  document.querySelectorAll('.lpick').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadStandings(idx);
}

function loadStandings(idx){
  const frame=document.getElementById('stf');
  frame.src=LEAGUES[idx].url;
  clearTimeout(window._st);
  window._st=setTimeout(()=>showFallback(idx),8000);
  frame.onload=()=>clearTimeout(window._st);
}

function showFallback(idx){
  document.getElementById('fw').innerHTML=`
  <div style="text-align:center;padding:20px 14px">
    <div style="font-family:'Barlow Condensed',sans-serif;color:var(--t2);font-size:.85rem;margin-bottom:16px">
      View <strong style="color:var(--t1)">${LEAGUES[idx].name}</strong> standings:
    </div>
    <div class="btn-links">
      <a href="${LEAGUES[idx].url}" target="_blank" class="ext-btn btn-primary">⚡ FlashScore Standings</a>
      <a href="${FALLBACK_LEAGUES[idx]}" target="_blank" class="ext-btn btn-secondary">📊 LiveScore Standings</a>
      <a href="https://www.bbc.com/sport/football/tables" target="_blank" class="ext-btn btn-secondary">📺 BBC Sport Tables</a>
      <a href="https://www.espn.com/soccer/standings" target="_blank" class="ext-btn btn-secondary">🏆 ESPN Standings</a>
    </div>
  </div>`;
}

buildPicker();
loadStandings(0);
</script>
</body>
</html>
