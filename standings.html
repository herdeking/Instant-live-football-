<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--blue:#4fc3f7;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px;border-bottom:1px solid var(--bd)}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.league-picker{display:flex;overflow-x:auto;gap:8px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.league-picker::-webkit-scrollbar{display:none}
.lpick{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:64px}
.lpick img{width:28px;height:28px;object-fit:contain;border-radius:50%;background:var(--s2)}
.lpick span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.58rem;letter-spacing:1px;text-transform:uppercase;text-align:center;line-height:1.2}
.lpick.active{background:rgba(0,233,107,.08);border-color:rgba(0,233,107,.4);color:var(--g)}
.lpick.active img{box-shadow:0 0 0 2px var(--g)}
.api-source{display:flex;align-items:center;gap:6px;padding:5px 14px;background:rgba(0,233,107,.05);border-bottom:1px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--t3)}
.api-dot{width:5px;height:5px;border-radius:50%;background:var(--g)}
.content{padding:10px 14px;overflow-x:auto}
.standings-table{width:100%;border-collapse:collapse;min-width:360px}
.standings-table thead tr{background:var(--s2);border-bottom:1px solid var(--bd)}
.standings-table th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--t3);padding:8px 5px;text-align:center;white-space:nowrap}
.standings-table th.left{text-align:left;padding-left:8px}
.standings-table td{font-family:'Barlow Condensed',sans-serif;font-size:.84rem;padding:8px 5px;text-align:center;border-bottom:1px solid rgba(30,45,61,.5)}
.standings-table td.left{text-align:left;padding-left:8px}
.standings-table tr:hover td{background:var(--s2)}
.pos{font-weight:700;color:var(--t3);font-size:.84rem}
.pos.champ{color:var(--g);font-size:.9rem}
.pos.ucl{color:var(--blue)}
.pos.uecl{color:var(--gold)}
.pos.rel{color:var(--red)}
.team-cell{display:flex;align-items:center;gap:7px}
.team-crest{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.team-name{font-weight:700;font-size:.84rem;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pts{font-weight:900;color:var(--t1);font-size:.92rem}
.form-cell{display:flex;gap:2px;justify-content:center}
.form-dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:900;font-family:'Barlow Condensed',sans-serif;letter-spacing:0}
.form-w{background:rgba(0,233,107,.2);color:var(--g)}
.form-d{background:rgba(138,154,176,.15);color:var(--t2)}
.form-l{background:rgba(255,53,53,.15);color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px;background:var(--s1);border:1px solid var(--bd);border-radius:8px}
.legend-item{display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:.68rem;color:var(--t3)}
.legend-dot{width:8px;height:8px;border-radius:50%}
.pos-bar{width:3px;border-radius:2px;height:36px;position:absolute;left:0;top:50%;transform:translateY(-50%)}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;line-height:1.8}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>

<body>

<div class="league-picker" id="league-picker"></div>
<div class="api-source" id="api-source" style="display:none"><div class="api-dot"></div><span id="api-name"></span></div>
<div class="content" id="standings-content">

</div>
<nav class="bottom-nav">

  <a class="bn-item" href="fixtures.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Fixtures</span></a>
  <a class="bn-item active" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>
<script>
const LB='https://media.api-sports.io/football/leagues/';
const LEAGUES=[
  {name:'Premier League',code:'PL',logo:LB+'39.png',ucl:4,uecl:6,rel:3,id:2021},
  {name:'La Liga',code:'PD',logo:LB+'140.png',ucl:4,uecl:6,rel:3,id:2014},
  {name:'Serie A',code:'SA',logo:LB+'135.png',ucl:4,uecl:6,rel:3,id:2019},
  {name:'Bundesliga',code:'BL1',logo:LB+'78.png',ucl:4,uecl:6,rel:2,id:2002},
  {name:'Ligue 1',code:'FL1',logo:LB+'61.png',ucl:3,uecl:5,rel:3,id:2015},
  {name:'Champions League',code:'CL',logo:LB+'2.png',ucl:0,uecl:0,rel:0,id:2001},
  {name:'Europa League',code:'EL',logo:LB+'3.png',ucl:0,uecl:0,rel:0,id:2146},
  {name:'Eredivisie',code:'DED',logo:LB+'88.png',ucl:2,uecl:5,rel:2,id:2003},
  {name:'Liga Portugal',code:'PPL',logo:LB+'94.png',ucl:2,uecl:4,rel:2,id:2017},
  {name:'Championship',code:'ELC',logo:LB+'40.png',ucl:0,uecl:0,rel:3,id:2016},
];

// Multiple API servers — tries each in order
const API_SERVERS=[
  {name:'Worker-1',type:'worker',url:'https://fulltime-proxy.REPLACE_ME_1.workers.dev'},
  {name:'Worker-2',type:'worker',url:'https://fulltime-proxy.REPLACE_ME_2.workers.dev'},
  {name:'Football-Data',type:'fd',url:'https://api.football-data.org/v4',key:'6e26ab7db1044d37bd7b0a94a6c06f1c'},
];

let selectedLeague=LEAGUES[0];

function buildLeaguePicker(){
  const picker=document.getElementById('league-picker');
  picker.innerHTML=LEAGUES.map((l,i)=>`
    <button class="lpick${i===0?' active':''}" onclick="selectLeague(${i},this)">
      <img src="${l.logo}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(l.name.substring(0,2))}&background=1a2330&color=8a9ab0&size=60'">
      <span>${l.name}</span>
    </button>`).join('');
}

function selectLeague(idx,btn){
  selectedLeague=LEAGUES[idx];
  document.querySelectorAll('.lpick').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadStandings();
}

async function fetchStandings(league){
  for(const server of API_SERVERS){
    if(server.url.includes('REPLACE_ME'))continue;
    try{
      let url,headers={};
      if(server.type==='worker'){
        url=`${server.url}/standings?league=${league.code}`;
      } else {
        url=`${server.url}/competitions/${league.code}/standings`;
        headers={'X-Auth-Token':server.key};
      }
      const res=await fetch(url,{headers});
      if(!res.ok)continue;
      const data=await res.json();
      const rows=data.standings?.[0]?.table||[];
      if(rows.length){
        document.getElementById('api-source').style.display='flex';
        document.getElementById('api-name').textContent='Source: '+server.name+' · Auto-fallback enabled';
        return rows;
      }
    }catch(e){continue;}
  }
  return null;
}

async function loadStandings(){
  document.getElementById('standings-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Loading standings…</span></div>';
  const rows=await fetchStandings(selectedLeague);
  if(!rows){
    document.getElementById('standings-content').innerHTML=`
    <div class="empty">
      Could not load standings.<br>
      <strong style="color:var(--t1)">Setup required:</strong><br>
      Deploy <strong>cloudflare-worker.js</strong> to Cloudflare Workers<br>
      and replace <code style="color:var(--g)">REPLACE_ME_1</code> with your worker name<br><br>
      <button onclick="loadStandings()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer">Retry</button>
    </div>`;
    return;
  }
  renderStandings(rows);
}

function renderStandings(rows){
  const l=selectedLeague;
  const total=rows.length;
  let html=`<table class="standings-table">
  <thead><tr>
    <th>#</th><th class="left">Club</th><th>MP</th><th>W</th><th>D</th><th>L</th>
    <th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th>
  </tr></thead><tbody>`;

  rows.forEach((row,i)=>{
    const pos=row.position||(i+1);
    const isChamp=pos===1;
    const isUCL=pos>1&&pos<=l.ucl;
    const isUECL=pos>l.ucl&&pos<=l.uecl;
    const isRel=l.rel>0&&pos>total-l.rel;
    const posClass=isChamp?'champ':isUCL?'ucl':isUECL?'uecl':isRel?'rel':'';
    const rowBorder=isChamp?'var(--g)':isUCL?'var(--blue)':isUECL?'var(--gold)':isRel?'var(--red)':'transparent';
    const form=(row.form||'').split(',').slice(-5);
    const formHtml=form.filter(Boolean).map(f=>`<div class="form-dot form-${f==='W'?'w':f==='L'?'l':'d'}">${f}</div>`).join('');
    const gd=row.goalDifference>=0?'+'+row.goalDifference:row.goalDifference;
    const crest=row.team?.crest||`https://crests.football-data.org/${row.team?.id||0}.png`;
    html+=`<tr style="border-left:3px solid ${rowBorder}">
      <td><span class="pos ${posClass}">${pos}</span></td>
      <td class="left"><div class="team-cell">
        <img class="team-crest" src="${crest}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent((row.team?.shortName||'?').substring(0,2))}&background=131920&color=00e96b&size=40'">
        <span class="team-name">${row.team?.shortName||row.team?.name||''}</span>
      </div></td>
      <td>${row.playedGames||0}</td>
      <td>${row.won||0}</td>
      <td>${row.draw||0}</td>
      <td>${row.lost||0}</td>
      <td>${row.goalsFor||0}</td>
      <td>${row.goalsAgainst||0}</td>
      <td style="color:${row.goalDifference>=0?'var(--g)':'var(--red)'}">${gd}</td>
      <td><span class="pts">${row.points||0}</span></td>
      <td><div class="form-cell">${formHtml}</div></td>
    </tr>`;
  });
  html+=`</tbody></table>`;

  if(l.ucl>0){
    html+=`<div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--g)"></div>Champions</div>
      ${l.ucl>1?`<div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>UCL</div>`:''}
      ${l.uecl>l.ucl?`<div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>UEL/UECL</div>`:''}
      ${l.rel>0?`<div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Relegation</div>`:''}
    </div>`;
  }
  document.getElementById('standings-content').innerHTML=html;
}

buildLeaguePicker();
loadStandings();
</script>
</body>
</html>
