<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FULLTIME — Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#00e96b;--gd:#00b854;
  --bg:#07090a;--s1:#0d1117;--s2:#131920;
  --bd:#1e2d3d;--bd2:#243447;
  --t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;
  --red:#ff3535;
}
html,body{height:100%}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden}

/* Background grid */
body::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);
  background-size:40px 40px;opacity:.15;pointer-events:none
}
/* Glow */
body::after{
  content:'';position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(0,233,107,.05) 0%,transparent 65%);
  pointer-events:none
}

.login-wrap{
  width:100%;max-width:380px;position:relative;z-index:1;
  animation:fadeIn .6s ease
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.brand{text-align:center;margin-bottom:28px}
.brand-logo{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:4px;color:var(--g);line-height:1}
.brand-logo span{color:var(--t1)}
.brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--t3);margin-top:4px}

.login-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)
}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2.5px;margin-bottom:4px}
.login-desc{font-size:.8rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;margin-bottom:22px}

.field{margin-bottom:16px}
.field label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2);margin-bottom:6px}
.field-wrap{position:relative}
.field input{
  width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  padding:11px 40px 11px 14px;color:var(--t1);
  font-family:'Barlow',sans-serif;font-size:.92rem;outline:none;
  transition:border-color .2s
}
.field input:focus{border-color:var(--g)}
.field input::placeholder{color:var(--t3)}
.toggle-pw{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:2px;color:var(--t3);
  transition:color .15s
}
.toggle-pw:hover{color:var(--t1)}
.toggle-pw svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.error-msg{
  display:none;background:rgba(255,53,53,.1);border:1px solid rgba(255,53,53,.3);
  border-radius:5px;padding:8px 12px;margin-bottom:14px;
  font-family:'Barlow Condensed',sans-serif;font-size:.8rem;color:var(--red);letter-spacing:.5px
}
.error-msg.show{display:block}

.login-btn{
  width:100%;background:var(--g);color:var(--bg);border:none;border-radius:7px;
  padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:.92rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:background .2s,transform .15s;margin-top:4px;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.login-btn:hover{background:var(--gd)}
.login-btn:active{transform:scale(.98)}
.login-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.5}

.login-footer{text-align:center;margin-top:16px}
.login-footer a{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;color:var(--t3);letter-spacing:1px;text-decoration:none;transition:color .2s}
.login-footer a:hover{color:var(--t1)}

/* Loading spinner */
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(7,9,10,.3);border-top-color:var(--bg);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Security badge */
.security{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:20px;opacity:.5}
.security svg{width:12px;height:12px;fill:none;stroke:var(--t3);stroke-width:2}
.security span{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-logo">FULL<span>TIME</span></div>
    <div class="brand-sub">Admin Control Centre</div>
  </div>

  <div class="login-card">
    <div class="login-title">Sign In</div>
    <div class="login-desc">Enter your administrator credentials to continue</div>

    <div class="error-msg" id="err">Incorrect username or password. Please try again.</div>

    <div class="field">
      <label for="uname">Username</label>
      <div class="field-wrap">
        <input type="text" id="uname" placeholder="Enter username" autocomplete="username" autocapitalize="none">
      </div>
    </div>

    <div class="field">
      <label for="pw">Password</label>
      <div class="field-wrap">
        <input type="password" id="pw" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="toggle-pw" onclick="togglePw()" type="button" title="Show/hide password">
          <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="login-btn" onclick="doLogin()">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span id="btn-text">Sign In to Dashboard</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="login-footer">
      <a href="index.html">← Back to site</a>
    </div>
  </div>

  <div class="security">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Secured Admin Access · FULLTIME</span>
  </div>
</div>

<script>
const ADMIN_USER = 'herdeking';
// Stored hashed or plain — for this demo plain comparison
// In production use bcrypt server-side
let storedPassword = 'Ayolad';
try {
  const saved = localStorage.getItem('ft_admin_pw');
  if (saved) storedPassword = saved;
} catch(e){}

function togglePw() {
  const inp = document.getElementById('pw');
  const icon = document.getElementById('eye-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function doLogin() {
  const u = document.getElementById('uname').value.trim();
  const p = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.classList.remove('show');

  if (!u || !p) { err.textContent = 'Please enter both username and password.'; err.classList.add('show'); return; }

  // Show loading
  document.getElementById('btn-text').textContent = 'Signing in…';
  document.getElementById('spinner').style.display = 'block';

  setTimeout(() => {
    if (u === ADMIN_USER && p === storedPassword) {
      try { localStorage.setItem('ft_admin_auth', 'true'); } catch(e){}
      window.location.href = 'admin-dashboard.html';
    } else {
      document.getElementById('btn-text').textContent = 'Sign In to Dashboard';
      document.getElementById('spinner').style.display = 'none';
      err.textContent = 'Incorrect username or password. Please try again.';
      err.classList.add('show');
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }, 900);
}
</script>
</body>
</html>
