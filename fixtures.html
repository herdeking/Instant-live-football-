<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fixtures — FullTime</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e96b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<script>(function(d,z,s){s.src='https://'+d+'/400/'+z;try{(document.body||document.documentElement).appendChild(s)}catch(e){}})('gizokraijaw.net',3325630,document.createElement('script'))</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px}
.date-strip{display:flex;overflow-x:auto;gap:6px;padding:8px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.date-strip::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:46px}
.dbtn .day{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.57rem;letter-spacing:1.5px;text-transform:uppercase}
.dbtn .num{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:1px;line-height:1}
.dbtn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.tab:hover:not(.active){border-color:var(--g);color:var(--g)}
.frame-outer{width:100%;overflow:hidden;position:relative;height:calc(100vh - 210px)}
.top-mask{position:absolute;top:0;left:0;right:0;height:110px;background:var(--bg);z-index:5;pointer-events:none}
.frame-inner{position:absolute;top:-110px;left:0;right:0;bottom:-70px}
.fx-frame{width:100%;height:calc(100vh - 210px + 180px);border:none;display:block}
.fallback{padding:20px 14px;text-align:center}
.fallback p{font-family:'Barlow Condensed',sans-serif;color:var(--t2);font-size:.85rem;margin-bottom:16px;line-height:1.8}
.ext-btn{display:block;text-align:center;padding:13px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;margin-bottom:10px}
.btn-g{background:var(--g);color:var(--bg)}
.btn-s{background:var(--s2);color:var(--t1);border:1px solid var(--bd)}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">FULL<span>TIME</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="livescores.html">Live Scores</a>
    <a href="fixtures.html" class="active">Fixtures</a>
    <a href="standings.html">Standings</a>
  </div>
</nav>
<div class="page-header">
  <div class="page-title">Fixtures</div>
  <span id="cur-date" style="font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:var(--t3)"></span>
</div>
<div class="date-strip" id="date-strip"></div>
<div class="tabs">
  <button class="tab active" onclick="setLeague('all',this)">All</button>
  <button class="tab" onclick="setLeague('epl',this)">EPL</button>
  <button class="tab" onclick="setLeague('laliga',this)">La Liga</button>
  <button class="tab" onclick="setLeague('seriea',this)">Serie A</button>
  <button class="tab" onclick="setLeague('bundesliga',this)">Bundesliga</button>
  <button class="tab" onclick="setLeague('ucl',this)">UCL</button>
</div>
<div class="frame-outer" id="fo">
  <div class="top-mask"></div>
  <div class="frame-inner">
    <iframe class="fx-frame" id="fxf" src="" scrolling="yes" allow="autoplay;fullscreen" loading="lazy"></iframe>
  </div>
</div>
<nav class="bottom-nav">
  <a class="bn-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
  <a class="bn-item" href="livescores.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg><span>Live</span></a>
  <a class="bn-item active" href="fixtures.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Fixtures</span></a>
  <a class="bn-item" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>
<script>
const PATHS={
  all:'football',epl:'football/england/premier-league',
  laliga:'football/spain/laliga',seriea:'football/italy/serie-a',
  bundesliga:'football/germany/bundesliga',ucl:'football/europe/champions-league'
};
let curLeague='all',curDate=today();

function today(){return new Date().toISOString().split('T')[0];}

function buildDates(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let h='';
  for(let i=-1;i<=6;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const s=d.toISOString().split('T')[0];
    const lbl=i===0?'Today':i===-1?'Yest':i===1?'Tom':days[d.getDay()];
    h+=`<button class="dbtn${s===curDate?' active':''}" onclick="setDate('${s}',this)">
      <div class="day">${lbl}</div><div class="num">${d.getDate()}</div>
    </button>`;
  }
  document.getElementById('date-strip').innerHTML=h;
}

function setDate(d,btn){
  curDate=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('cur-date').textContent=d;
  updateFrame();
}

function setLeague(l,btn){
  curLeague=l;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  updateFrame();
}

function updateFrame(){
  const path=PATHS[curLeague]||'football';
  const url=`https://www.flashscore.com/${path}/`;
  const fo=document.getElementById('fo');
  fo.innerHTML=`
    <div class="top-mask"></div>
    <div class="frame-inner">
      <iframe class="fx-frame" id="fxf" src="${url}" scrolling="yes" allow="autoplay;fullscreen" loading="lazy"></iframe>
    </div>`;
  clearTimeout(window._ft);
  window._ft=setTimeout(()=>showFallback(url),9000);
  document.getElementById('fxf').onload=()=>clearTimeout(window._ft);
}

function showFallback(url){
  document.getElementById('fo').innerHTML=`
  <div class="fallback">
    <p>View fixtures for <strong style="color:var(--t1)">${curDate}</strong>:</p>
    <a href="${url}" target="_blank" class="ext-btn btn-g">⚡ FlashScore Fixtures</a>
    <a href="https://www.livescore.com/en/football/" target="_blank" class="ext-btn btn-s">📊 LiveScore Fixtures</a>
    <a href="https://www.bbc.com/sport/football/scores-fixtures" target="_blank" class="ext-btn btn-s">📺 BBC Sport</a>
  </div>`;
}

buildDates();
document.getElementById('cur-date').textContent=curDate;
updateFrame();
</script>
</body>
</html>
