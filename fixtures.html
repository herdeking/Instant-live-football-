<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--s3:#1a2330;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;gap:2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px 14px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.league-select{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;color:var(--t1);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;outline:none;cursor:pointer}
.date-strip{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.date-strip::-webkit-scrollbar{display:none}
.date-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:52px}
.date-btn .day{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase}
.date-btn .num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;line-height:1}
.date-btn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.content{padding:10px 14px}
.fixture-group{margin-bottom:16px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr img{width:18px;height:18px;object-fit:contain;border-radius:50%}
.group-hdr span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.fixture-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;transition:all .15s}
.fixture-card:hover{border-color:var(--g);background:var(--s2)}
.fx-time{min-width:44px;text-align:center}
.fx-kickoff{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:var(--gold);line-height:1}
.fx-date{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;color:var(--t3);letter-spacing:.5px}
.fx-teams{flex:1;display:flex;flex-direction:column;gap:6px}
.fx-team{display:flex;align-items:center;gap:8px}
.fx-crest{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.fx-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.88rem;flex:1}
.fx-score{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;min-width:14px;text-align:right}
.fx-status{min-width:44px;text-align:center}
.fx-live{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.fx-ft{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;color:var(--t3)}
.fx-upcoming{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3);text-align:center;line-height:1.3}
.loading-state{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem}
.spinner{width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:40px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>

<script>
const LB='https://media.api-sports.io/football/leagues/';
const TB='https://media.api-sports.io/football/teams/';

function getTeamLogo(name){
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name||'?')}&background=131920&color=00e96b&size=40&bold=true&font-size=0.4`;
}
function getLeagueLogo(name){
  return `https://ui-avatars.com/api/?name=${encodeURIComponent((name||'').substring(0,2))}&background=1a2330&color=8a9ab0&size=30&bold=true`;
}

let selectedDate = new Date().toISOString().split('T')[0];
let allFixtures = [];

function buildDateStrip(){
  const strip = document.getElementById('date-strip');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = '';
  for(let i=-1; i<=6; i++){
    const d = new Date();
    d.setDate(d.getDate()+i);
    const str = d.toISOString().split('T')[0];
    const label = i===0?'Today':i===-1?'Yest':i===1?'Tom':days[d.getDay()];
    html += `<button class="date-btn${str===selectedDate?' active':''}" onclick="selectDate('${str}',this)">
      <div class="day">${label}</div>
      <div class="num">${d.getDate()}</div>
    </button>`;
  }
  strip.innerHTML = html;
}

function selectDate(date, btn){
  selectedDate = date;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  loadFixtures();
}

async function loadFixtures(){
  document.getElementById('fx-content').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading fixtures…</span></div>';

  try{
    const res = await fetch(`https://api.sofascore.com/api/v1/sport/football/scheduled-events/${selectedDate}`);
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    allFixtures = data.events || [];

    // Filter by league if selected
    const leagueVal = document.getElementById('league-select').value;

    renderFixtures(leagueVal);
    document.getElementById('fx-sub').textContent = `${allFixtures.length} matches · ${selectedDate}`;
  }catch(e){
    document.getElementById('fx-content').innerHTML = `<div class="empty">Could not load fixtures.<br><button onclick="loadFixtures()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;margin-top:10px">Retry</button></div>`;
  }
}

function renderFixtures(leagueFilter){
  let filtered = allFixtures;

  // Group by tournament
  const groups = {};
  filtered.forEach(m=>{
    const t = m.tournament?.name || 'Football';
    if(!groups[t]) groups[t] = [];
    groups[t].push(m);
  });

  if(!Object.keys(groups).length){
    document.getElementById('fx-content').innerHTML = '<div class="empty">No fixtures found for this date</div>';
    return;
  }

  let html = '';
  Object.entries(groups).forEach(([league, matches])=>{
    html += `<div class="fixture-group">
    <div class="group-hdr">
      <img src="${getLeagueLogo(league)}" onerror="this.style.display='none'">
      <span>${league}</span>
      <span style="margin-left:auto;font-size:.65rem;color:var(--t3)">${matches.length} match${matches.length!==1?'es':''}</span>
    </div>`;

    matches.sort((a,b)=>(a.startTimestamp||0)-(b.startTimestamp||0)).forEach(m=>{
      const hs = m.homeScore?.current ?? '';
      const as_ = m.awayScore?.current ?? '';
      const st = m.status?.type;
      const isLive = st === 'inprogress';
      const isFt = st === 'finished';
      const min = m.time?.played;
      const kickoff = m.startTimestamp ? new Date(m.startTimestamp*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}) : 'TBC';
      const dateStr = m.startTimestamp ? new Date(m.startTimestamp*1000).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Africa/Lagos'}) : '';
      const hWin = isFt && hs > as_;
      const aWin = isFt && as_ > hs;

      html += `<div class="fixture-card">
        <div class="fx-time">
          <div class="fx-kickoff">${kickoff}</div>
          <div class="fx-date">${dateStr}</div>
        </div>
        <div class="fx-teams">
          <div class="fx-team">
            <img class="fx-crest" src="${getTeamLogo(m.homeTeam?.name)}" onerror="this.style.opacity=0">
            <div class="fx-name" style="${aWin?'color:var(--t3)':''}">${m.homeTeam?.name||''}</div>
            ${isLive||isFt?`<div class="fx-score" style="${aWin?'color:var(--t3)':''}">${hs}</div>`:''}
          </div>
          <div class="fx-team">
            <img class="fx-crest" src="${getTeamLogo(m.awayTeam?.name)}" onerror="this.style.opacity=0">
            <div class="fx-name" style="${hWin?'color:var(--t3)':''}">${m.awayTeam?.name||''}</div>
            ${isLive||isFt?`<div class="fx-score" style="${hWin?'color:var(--t3)':''}">${as_}</div>`:''}
          </div>
        </div>
        <div class="fx-status">
          ${isLive?`<div class="fx-live"><span class="ldot"></span><span>${min?min+"'":''}</span></div>`:isFt?`<div class="fx-ft">FT</div>`:`<div class="fx-upcoming">WAT<br>${kickoff}</div>`}
        </div>
      </div>`;
    });
    html += '</div>';
  });

  document.getElementById('fx-content').innerHTML = html;
}

buildDateStrip();
loadFixtures();
</script>
</body>
