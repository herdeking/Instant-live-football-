<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.date-strip{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.date-strip::-webkit-scrollbar{display:none}
.date-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:52px}
.date-btn .day{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase}
.date-btn .num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;line-height:1}
.date-btn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.api-source{display:flex;align-items:center;gap:6px;padding:5px 14px;background:rgba(0,233,107,.05);border-bottom:1px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:1px;color:var(--t3)}
.api-dot{width:5px;height:5px;border-radius:50%;background:var(--g)}
.content{padding:10px 14px}
.match-group{margin-bottom:14px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr img{width:18px;height:18px;object-fit:contain;border-radius:50%}
.group-hdr-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.fixture-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all .15s}
.fixture-card:hover{border-color:var(--g);background:var(--s2)}
.fx-time{min-width:40px;text-align:center;flex-shrink:0}
.fx-kickoff{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:var(--gold);line-height:1}
.fx-date-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;color:var(--t3);letter-spacing:.5px}
.fx-teams{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.fx-team-row{display:flex;align-items:center;gap:7px}
.fx-crest{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.fx-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.86rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-name.dim{color:var(--t3)}
.fx-score{font-family:'Bebas Neue',sans-serif;font-size:1rem;min-width:14px;text-align:right;flex-shrink:0}
.fx-score.win{color:var(--t1);font-size:1.1rem}
.fx-score.lose{color:var(--t3)}
.fx-status{min-width:38px;text-align:center;flex-shrink:0}
.fx-live{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.fx-ft{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;color:var(--t3)}
.has-stream{position:relative}
.has-stream::after{content:'▶';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--g);font-size:.7rem}
.stream-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(0,233,107,.1);border:1px solid rgba(0,233,107,.2);border-radius:4px;padding:1px 5px;font-family:'Barlow Condensed',sans-serif;font-size:.58rem;color:var(--g);font-weight:700}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:30px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;line-height:1.8}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>

<script>
// =====================================================
// MULTIPLE API SERVERS — Tries each in order until one works
// =====================================================
const API_SERVERS = [
  // Server 1: PPV.to (for streams + football events)
  { name: 'PPV.to', type: 'ppv', url: 'https://ppv.to/api/streams' },
  // Server 2: Cloudflare Worker (deploy cloudflare-worker.js)
  { name: 'Worker-1', type: 'worker', url: 'https://fulltime-proxy.REPLACE_ME_1.workers.dev' },
  // Server 3: Second Cloudflare Worker backup
  { name: 'Worker-2', type: 'worker', url: 'https://fulltime-proxy.REPLACE_ME_2.workers.dev' },
  // Server 4: Direct football-data.org (may have CORS issues but worth trying)
  { name: 'Football-Data', type: 'fd', url: 'https://api.football-data.org/v4', key: '6e26ab7db1044d37bd7b0a94a6c06f1c' },
];

const LB = 'https://media.api-sports.io/football/leagues/';
const COMP_LOGOS = {'PL':LB+'39.png','PD':LB+'140.png','SA':LB+'135.png','BL1':LB+'78.png','FL1':LB+'61.png','CL':LB+'2.png','EL':LB+'3.png','ELC':LB+'40.png','DED':LB+'88.png','PPL':LB+'94.png'};
function getCompLogo(code){return COMP_LOGOS[code]||`https://ui-avatars.com/api/?name=${encodeURIComponent(code||'?')}&background=1a2330&color=8a9ab0&size=30`;}

let allFixtures=[], selectedDate=new Date().toISOString().split('T')[0];
let ppvStreams=[];

function buildDateStrip(){
  const strip=document.getElementById('date-strip');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html='';
  for(let i=-1;i<=6;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const str=d.toISOString().split('T')[0];
    const label=i===0?'Today':i===-1?'Yest':i===1?'Tom':days[d.getDay()];
    html+=`<button class="date-btn${str===selectedDate?' active':''}" onclick="selectDate('${str}',this)"><div class="day">${label}</div><div class="num">${d.getDate()}</div></button>`;
  }
  strip.innerHTML=html;
}

function selectDate(date,btn){
  selectedDate=date;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadFixtures();
}

// Fetch PPV.to streams for stream availability
async function fetchPPVStreams(){
  try{
    const res=await fetch('https://ppv.to/api/streams');
    if(!res.ok)return;
    const data=await res.json();
    ppvStreams=[];
    (data.streams||[]).forEach(cat=>(cat.streams||[]).forEach(s=>ppvStreams.push({...s,category:cat.category})));
  }catch(e){}
}

function hasPPVStream(homeName, awayName){
  if(!ppvStreams.length)return false;
  const h=homeName.toLowerCase().split(' ')[0];
  const a=awayName.toLowerCase().split(' ')[0];
  const now=Date.now()/1000;
  return ppvStreams.some(s=>{
    const n=s.name.toLowerCase();
    const live=s.always_live===1||(s.starts_at<=now&&(s.ends_at===0||s.ends_at>now));
    return live&&(n.includes(h)||n.includes(a));
  });
}

async function fetchFixtures(date){
  for(const server of API_SERVERS){
    if(server.url.includes('REPLACE_ME')) continue; // Skip unconfigured workers
    try{
      let url, headers={}, data;
      if(server.type==='ppv'){
        // PPV.to shows current streams — use as live source
        const res=await fetch(server.url);
        if(!res.ok)continue;
        data=await res.json();
        // Convert PPV streams to fixture format
        const now=Date.now()/1000;
        const matches=[];
        (data.streams||[]).forEach(cat=>{
          (cat.streams||[]).forEach(s=>{
            const isFootball=cat.category?.toLowerCase().includes('football')||cat.category?.toLowerCase().includes('soccer')||cat.category?.toLowerCase().includes('liga')||cat.category?.toLowerCase().includes('premier')||cat.category?.toLowerCase().includes('serie')||cat.category?.toLowerCase().includes('bundesliga')||cat.category?.toLowerCase().includes('champions')||cat.category?.toLowerCase().includes('europa');
            if(!isFootball)return;
            const isLive=s.always_live===1||(s.starts_at&&s.starts_at<=now&&(s.ends_at===0||s.ends_at>now));
            const isUpcoming=s.starts_at&&s.starts_at>now;
            if(!isLive&&!isUpcoming)return;
            // Parse team names from stream name (e.g. "Arsenal vs Chelsea")
            const vsMatch=s.name.match(/^(.+?)\s+(?:vs?\.?|–|-)\s+(.+?)(\s+\[|$)/i);
            matches.push({
              id:s.id,
              homeTeam:{name:vsMatch?vsMatch[1].trim():s.name,shortName:vsMatch?vsMatch[1].trim():s.name,crest:''},
              awayTeam:{name:vsMatch?vsMatch[2]?.trim()||'':s.name,shortName:vsMatch?vsMatch[2]?.trim()||'':'',crest:''},
              competition:{name:cat.category||'Football',code:''},
              status:isLive?'IN_PLAY':'SCHEDULED',
              utcDate:s.starts_at?new Date(s.starts_at*1000).toISOString():new Date().toISOString(),
              score:{fullTime:{home:null,away:null}},
              hasStream:true,
              streamId:s.uri_name||s.id,
            });
          });
        });
        if(matches.length){
          showApiSource(server.name);
          return matches;
        }
        continue;
      } else if(server.type==='worker'){
        url=`${server.url}/matches?date=${date}`;
      } else if(server.type==='fd'){
        url=`${server.url}/matches?dateFrom=${date}&dateTo=${date}`;
        headers={'X-Auth-Token':server.key};
      }
      const res=await fetch(url,{headers});
      if(!res.ok)continue;
      const json=await res.json();
      if(json.matches&&json.matches.length){
        showApiSource(server.name);
        return json.matches;
      }
    }catch(e){continue;}
  }
  return null;
}

function showApiSource(name){
  const el=document.getElementById('api-source');
  document.getElementById('api-name').textContent='Source: '+name+' · Auto-fallback enabled';
  el.style.display='flex';
}

async function loadFixtures(){
  document.getElementById('fx-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Fetching fixtures…</span></div>';
  document.getElementById('fx-sub').textContent='Loading…';
  fetchPPVStreams(); // Background fetch PPV streams
  const matches=await fetchFixtures(selectedDate);
  if(!matches||!matches.length){
    document.getElementById('fx-content').innerHTML=`<div class="empty">No fixtures found for ${selectedDate}<br><br><button onclick="loadFixtures()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer">Retry</button></div>`;
    document.getElementById('fx-sub').textContent='No data available';
    return;
  }
  allFixtures=matches;
  renderFixtures();
  document.getElementById('fx-sub').textContent=`${matches.length} matches · ${selectedDate}`;
}

function renderFixtures(){
  const groups={};
  allFixtures.forEach(m=>{const k=m.competition?.name||'Football';if(!groups[k])groups[k]={code:m.competition?.code||'',matches:[]};groups[k].matches.push(m);});
  const order={'IN_PLAY':0,'PAUSED':1,'FINISHED':2,'SCHEDULED':3,'TIMED':3};
  let html='';
  Object.entries(groups).forEach(([league,{code,matches}])=>{
    html+=`<div class="match-group"><div class="group-hdr"><img src="${getCompLogo(code)}" onerror="this.style.display='none'"><span class="group-hdr-name">${league}</span><span style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3)">${matches.length}</span></div>`;
    matches.sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)).forEach(m=>{
      const isLive=m.status==='IN_PLAY'||m.status==='PAUSED';
      const isFt=m.status==='FINISHED';
      const hs=m.score?.fullTime?.home??'';
      const as_=m.score?.fullTime?.away??'';
      const kickoff=m.utcDate?new Date(m.utcDate).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}):'TBC';
      const hWin=isFt&&hs!==''&&hs>as_;const aWin=isFt&&as_!==''&&as_>hs;
      const hLogo=m.homeTeam?.crest||`https://crests.football-data.org/${m.homeTeam?.id||0}.png`;
      const aLogo=m.awayTeam?.crest||`https://crests.football-data.org/${m.awayTeam?.id||0}.png`;
      const streamAvailable=m.hasStream||hasPPVStream(m.homeTeam?.name||'',m.awayTeam?.name||'');
      html+=`<div class="fixture-card${streamAvailable?' has-stream':''}">
        <div class="fx-time"><div class="fx-kickoff">${kickoff}</div>${streamAvailable?'<div class="stream-badge">▶ Live</div>':''}</div>
        <div class="fx-teams">
          <div class="fx-team-row"><img class="fx-crest" src="${hLogo}" onerror="this.style.opacity=0"><span class="fx-name${aWin?' dim':''}">${m.homeTeam?.shortName||m.homeTeam?.name||''}</span>${isLive||isFt?`<span class="fx-score${hWin?' win':aWin?' lose':''}">${hs}</span>`:''}</div>
          <div class="fx-team-row"><img class="fx-crest" src="${aLogo}" onerror="this.style.opacity=0"><span class="fx-name${hWin?' dim':''}">${m.awayTeam?.shortName||m.awayTeam?.name||''}</span>${isLive||isFt?`<span class="fx-score${aWin?' win':hWin?' lose':''}">${as_}</span>`:''}</div>
        </div>
        <div class="fx-status">${isLive?`<div class="fx-live"><span class="ldot"></span><span>${m.minute?m.minute+"'":''}</span></div>`:isFt?`<div class="fx-ft">FT</div>`:''}</div>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('fx-content').innerHTML=html;
}

buildDateStrip();
loadFixtures();
</script>
