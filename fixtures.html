<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--s3:#1a2330;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.refresh-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:6px 12px;color:var(--g);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1px;cursor:pointer}
.source-bar{padding:5px 14px;background:rgba(0,233,107,.05);border-bottom:1px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3);display:flex;align-items:center;gap:6px}
.source-dot{width:5px;height:5px;border-radius:50%;background:var(--g);flex-shrink:0}
.time-filter{display:flex;overflow-x:auto;gap:6px;padding:8px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.time-filter::-webkit-scrollbar{display:none}
.tfbtn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;white-space:nowrap}
.tfbtn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.tfbtn:hover:not(.active){border-color:var(--g);color:var(--g)}
.content{padding:10px 14px}
.match-group{margin-bottom:14px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.fx-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:all .15s;cursor:pointer}
.fx-card:hover{border-color:var(--g);background:var(--s2)}
.fx-card.live{border-color:rgba(0,233,107,.3);background:rgba(0,233,107,.03)}
.fx-time{min-width:48px;text-align:center;flex-shrink:0}
.fx-kickoff{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:var(--gold);line-height:1}
.fx-live-txt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.fx-info{flex:1;min-width:0}
.fx-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-cat{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;color:var(--t3);margin-top:2px}
.fx-poster{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--s2)}
.fx-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(0,233,107,.1);border:1px solid rgba(0,233,107,.2);border-radius:4px;padding:1px 6px;font-family:'Barlow Condensed',sans-serif;font-size:.6rem;color:var(--g);font-weight:700;margin-top:4px}
.upcoming-badge{background:rgba(255,193,7,.1);border-color:rgba(255,193,7,.2);color:var(--gold)}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:30px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;line-height:1.8}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>

<body>
<nav>

<div class="page-header">
  <div>
    <div class="page-title">Fixtures</div>
    <div class="page-sub" id="fx-sub">Loading…</div>
  </div>
  <button class="refresh-btn" onclick="loadFixtures()">↻ Refresh</button>
</div>
<div class="source-bar"><div class="source-dot"></div><span id="source-label">PPV.to · Loading…</span></div>
<div class="time-filter">
  <button class="tfbtn active" onclick="filterTime('all',this)">All</button>
  <button class="tfbtn" onclick="filterTime('live',this)">🔴 Live Now</button>
  <button class="tfbtn" onclick="filterTime('soon',this)">⏰ Starting Soon</button>
  <button class="tfbtn" onclick="filterTime('today',this)">📅 Today</button>
  <button class="tfbtn" onclick="filterTime('football',this)">⚽ Football</button>
</div>
<div class="content" id="fx-content">
  <div class="loading-state"><div class="spinner"></div><span>Fetching fixtures…</span></div>
</div>
<nav class="bottom-nav">
  <a class="bn-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
  <a class="bn-item" href="livescores.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg><span>Live</span></a>
  <a class="bn-item active" href="fixtures.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Fixtures</span></a>
  <a class="bn-item" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>
<script>
const PPV_API='https://ppv.to/api/streams';
const BACKUP=['https://holy-band-6142.herdeking.workers.dev/live'];
const FOOTBALL_CATS=['football','soccer','liga','premier','serie','bundesliga','champions','europa','ligue','laliga','calcio','futbol','fa cup','coppa','dfb','eredivisie','primera','super lig','npfl'];

let allEvents=[], timeFilter='all';

function isFootball(cat){ return FOOTBALL_CATS.some(w=>(cat||'').toLowerCase().includes(w)); }

function getCatEmoji(cat){
  const n=(cat||'').toLowerCase();
  if(isFootball(n)) return '⚽';
  if(n.includes('basketball')||n.includes('nba')) return '🏀';
  if(n.includes('tennis')) return '🎾';
  if(n.includes('boxing')||n.includes('mma')||n.includes('ufc')) return '🥊';
  if(n.includes('rugby')) return '🏉';
  if(n.includes('cricket')) return '🏏';
  if(n.includes('motor')||n.includes('f1')||n.includes('racing')) return '🏎️';
  return '🏆';
}

function filterTime(f,btn){
  timeFilter=f;
  document.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderFixtures();
}

async function loadFixtures(){
  document.getElementById('fx-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Fetching fixtures…</span></div>';
  document.getElementById('fx-sub').textContent='Loading…';

  let data=null;
  try{
    const res=await fetch(PPV_API,{headers:{'Accept':'application/json'}});
    if(res.ok) data=await res.json();
  }catch(e){}

  if(!data){
    for(const url of BACKUP){
      try{const r=await fetch(url);if(r.ok){data=await r.json();break;}}catch(e){}
    }
  }

  if(!data){
    document.getElementById('fx-content').innerHTML=`<div class="empty">Could not load fixtures.<br><button onclick="loadFixtures()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;margin-top:8px">Retry</button></div>`;
    return;
  }

  const now=Date.now()/1000;
  allEvents=[];
  (data.streams||[]).forEach(cat=>{
    (cat.streams||[]).forEach(s=>{
      const isLive=s.always_live===1||(s.starts_at&&s.starts_at<=now&&(s.ends_at===0||s.ends_at>now));
      const isUpcoming=s.starts_at&&s.starts_at>now;
      if(!isLive&&!isUpcoming)return;
      allEvents.push({
        id:s.id, name:s.name||'',
        category:cat.category||'Other',
        poster:s.poster||'',
        starts_at:s.starts_at||0,
        ends_at:s.ends_at||0,
        always_live:s.always_live||0,
        uri_name:s.uri_name||'',
        iframe:s.iframe||'',
        isLive, isUpcoming,
        isFootball:isFootball(cat.category),
      });
    });
  });

  allEvents.sort((a,b)=>{
    if(a.isLive!==b.isLive) return a.isLive?-1:1;
    return (a.starts_at||0)-(b.starts_at||0);
  });

  const liveN=allEvents.filter(e=>e.isLive).length;
  const upN=allEvents.filter(e=>e.isUpcoming).length;
  document.getElementById('fx-sub').textContent=`${liveN} live · ${upN} upcoming · PPV.to`;
  document.getElementById('source-label').textContent=`PPV.to · ${allEvents.length} events · Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  renderFixtures();
}

function renderFixtures(){
  const now=Date.now()/1000;
  let filtered=allEvents;
  if(timeFilter==='live') filtered=allEvents.filter(e=>e.isLive);
  else if(timeFilter==='soon') filtered=allEvents.filter(e=>e.isUpcoming&&e.starts_at>0&&e.starts_at-now<3600);
  else if(timeFilter==='today') filtered=allEvents.filter(e=>{
    const d=new Date(e.starts_at*1000);const t=new Date();
    return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth();
  });
  else if(timeFilter==='football') filtered=allEvents.filter(e=>e.isFootball);

  if(!filtered.length){
    document.getElementById('fx-content').innerHTML='<div class="empty">No events found for this filter</div>';
    return;
  }

  const groups={};
  filtered.forEach(e=>{
    if(!groups[e.category])groups[e.category]=[];
    groups[e.category].push(e);
  });

  let html='';
  Object.entries(groups).forEach(([cat,events])=>{
    html+=`<div class="match-group">
    <div class="group-hdr"><span style="font-size:1rem">${getCatEmoji(cat)}</span><span class="group-hdr-name">${cat}</span><span style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3)">${events.length}</span></div>`;
    events.forEach(e=>{
      const streamUrl=e.uri_name?`https://ppv.to/streams/${e.uri_name}`:'';
      const kickoff=e.starts_at?new Date(e.starts_at*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}):'';
      const minLeft=e.starts_at?Math.round((e.starts_at-now)/60):0;
      const timeDisplay=e.isLive?'LIVE':minLeft<=60&&minLeft>0?`${minLeft}m`:kickoff;
      html+=`<div class="fx-card ${e.isLive?'live':''}" onclick="${streamUrl?`window.open('${streamUrl}','_blank')`:''}">
        <div class="fx-time">${e.isLive?`<div class="fx-live-txt"><span class="ldot"></span><span style="font-size:.65rem">LIVE</span></div>`:`<div class="fx-kickoff">${timeDisplay}</div>`}</div>
        <div class="fx-info">
          <div class="fx-name">${e.name}</div>
          <div class="fx-cat">${cat}</div>
          <div>${e.isLive?`<span class="fx-badge">▶ Watch Now</span>`:`<span class="fx-badge upcoming-badge">⏰ ${timeDisplay}</span>`}</div>
        </div>
        ${e.poster?`<img class="fx-poster" src="${e.poster}" onerror="this.style.display='none'">`:''}
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('fx-content').innerHTML=html;
}

loadFixtures();
setInterval(loadFixtures,60000);
</script>
</body>
