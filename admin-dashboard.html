<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FullTime Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c10;--s1:#0d1117;--s2:#161b22;--s3:#1c2128;--g:#00e676;--g2:#69ff47;--red:#ff1744;--yellow:#ffcc00;--blue:#2196f3;--t1:#e6edf3;--t2:#8b949e;--t3:#484f58;--bd:#21262d;--bd2:#30363d;--r:10px}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t1);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
.topbar{height:56px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;position:relative;z-index:10}
.tb-logo{font-size:1.1rem;font-weight:800;letter-spacing:-0.5px;color:#fff}
.tb-logo span{color:var(--g)}
.tb-spacer{flex:1}
.tb-date{font-size:.72rem;color:var(--t2)}
.tb-logout{background:none;border:1px solid var(--bd2);border-radius:6px;color:var(--t2);padding:6px 12px;font-size:.75rem;cursor:pointer;min-height:36px}
.stats-bar{display:flex;gap:0;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.stats-bar::-webkit-scrollbar{display:none}
.stat-item{flex:1;min-width:80px;padding:12px 10px;text-align:center;border-right:1px solid var(--bd);cursor:pointer;transition:background .15s}
.stat-item:last-child{border-right:none}
.stat-item:active{background:var(--s2)}
.stat-num{font-size:1.4rem;font-weight:800;line-height:1;color:#fff}
.stat-num.green{color:var(--g)}
.stat-num.yellow{color:var(--yellow)}
.stat-num.blue{color:var(--blue)}
.stat-lbl{font-size:.6rem;color:var(--t2);letter-spacing:.5px;margin-top:3px;text-transform:uppercase}
.tab-nav{display:flex;background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 16px;font-size:.75rem;font-weight:600;color:var(--t2);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;min-height:44px;letter-spacing:.3px}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g)}
.tab-btn:active{background:var(--s2)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.panel{display:none}
.panel.active{display:block}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.sec-action{background:var(--g);color:#000;border:none;border-radius:6px;padding:8px 14px;font-size:.78rem;font-weight:700;cursor:pointer;min-height:36px}
.match-list{display:flex;flex-direction:column;gap:8px}
.mc{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.mc-top{display:flex;align-items:center;padding:10px 12px;gap:8px;border-bottom:1px solid var(--bd)}
.mc-badge{font-size:.6rem;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:20px;text-transform:uppercase;flex-shrink:0}
.mc-badge.live{background:rgba(255,23,68,.15);color:var(--red);border:1px solid rgba(255,23,68,.3)}
.mc-badge.upcoming{background:rgba(255,204,0,.12);color:var(--yellow);border:1px solid rgba(255,204,0,.25)}
.mc-badge.finished{background:rgba(139,148,158,.1);color:var(--t2);border:1px solid var(--bd)}
.mc-comp{font-size:.7rem;color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-time{font-size:.68rem;color:var(--t3);flex-shrink:0}
.mc-body{padding:12px}
.mc-teams{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mc-team{flex:1;font-size:.88rem;font-weight:700;color:var(--t1)}
.mc-team.right{text-align:right}
.mc-score-box{background:var(--s2);border:1px solid var(--bd2);border-radius:6px;padding:4px 12px;font-size:1rem;font-weight:800;color:#fff;flex-shrink:0}
.mc-actions{display:flex;gap:6px;flex-wrap:wrap}
.mc-btn{flex:1;min-width:60px;padding:8px 6px;border-radius:6px;border:1px solid var(--bd2);background:var(--s2);color:var(--t2);font-size:.7rem;font-weight:600;cursor:pointer;text-align:center;min-height:36px;transition:all .15s}
.mc-btn:active{background:var(--s3)}
.mc-btn.live-btn{border-color:rgba(255,23,68,.4);color:var(--red);background:rgba(255,23,68,.08)}
.mc-btn.edit-btn{border-color:rgba(0,230,118,.3);color:var(--g);background:rgba(0,230,118,.07)}
.mc-btn.del-btn{border-color:rgba(255,23,68,.2);color:var(--red)}
.form-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.form-title{font-size:.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-title::before{content:"";width:3px;height:14px;background:var(--g);border-radius:2px;display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:.7rem;color:var(--t2);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--t1);padding:10px 12px;font-size:.85rem;outline:none;-webkit-appearance:none;min-height:44px}
.field input:focus,.field select:focus{border-color:var(--g)}
.field select option{background:var(--s2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-primary{width:100%;background:var(--g);color:#000;border:none;border-radius:8px;padding:14px;font-size:.9rem;font-weight:800;cursor:pointer;min-height:52px;margin-top:4px}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;background:var(--s2);color:var(--t1);border:1px solid var(--bd2);border-radius:8px;padding:12px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:48px;margin-top:8px}
.score-editor{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.score-team{flex:1;font-size:.78rem;font-weight:700;color:var(--t1);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.score-minus,.score-plus{width:40px;height:40px;border-radius:8px;border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:1.2rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:40px}
.score-minus:active,.score-plus:active{background:var(--s3)}
.score-val{font-size:1.5rem;font-weight:800;color:#fff;min-width:32px;text-align:center}
.subs-list{display:flex;flex-direction:column;gap:6px}
.sub-row{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px}
.sub-email{flex:1;font-size:.82rem;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-plan{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(0,230,118,.1);color:var(--g);border:1px solid rgba(0,230,118,.2);flex-shrink:0}
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-icon{font-size:2rem;margin-bottom:8px}
.empty p{font-size:.82rem}
.loading{display:flex;align-items:center;gap:10px;padding:20px;color:var(--t2);font-size:.82rem}
.spinner{width:18px;height:18px;border:2px solid var(--bd2);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--bd2);color:var(--t1);padding:10px 18px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(0,230,118,.4);color:var(--g)}
.toast.error{border-color:rgba(255,23,68,.4);color:var(--red)}
.dialog-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.dialog-bg.open{opacity:1;pointer-events:all}
.dialog{background:var(--s1);border:1px solid var(--bd);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:24px 20px;transform:translateY(40px);transition:transform .25s}
.dialog-bg.open .dialog{transform:translateY(0)}
.dialog h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.dialog p{font-size:.82rem;color:var(--t2);margin-bottom:20px;line-height:1.5}
.dialog-btns{display:flex;gap:10px}
.dialog-btns button{flex:1;padding:13px;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;min-height:48px;border:none}
.dialog-cancel{background:var(--s2);color:var(--t1);border:1px solid var(--bd2)!important}
.dialog-confirm{background:var(--red);color:#fff}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease-in-out infinite;display:inline-block;margin-right:4px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo">Full<span>Time</span> <span style="font-size:.65rem;color:var(--t3);font-weight:400">Admin</span></div>
  <div class="tb-spacer"></div>
  <div class="tb-date" id="tb-date"></div>
  <button class="tb-logout" onclick="logout()">Log out</button>
</div>
<div class="stats-bar">
  <div class="stat-item" onclick="switchTab('matches',null)">
    <div class="stat-num green" id="st-live">0</div>
    <div class="stat-lbl">Live</div>
  </div>
  <div class="stat-item" onclick="switchTab('matches',null)">
    <div class="stat-num yellow" id="st-upcoming">0</div>
    <div class="stat-lbl">Upcoming</div>
  </div>
  <div class="stat-item" onclick="switchTab('matches',null)">
    <div class="stat-num" id="st-total">0</div>
    <div class="stat-lbl">Total</div>
  </div>
  <div class="stat-item" onclick="switchTab('subs',null)">
    <div class="stat-num blue" id="st-subs">0</div>
    <div class="stat-lbl">Subscribers</div>
  </div>
</div>
<div class="tab-nav" id="tab-nav">
  <button class="tab-btn active" onclick="switchTab('matches',this)">Matches</button>
  <button class="tab-btn" onclick="switchTab('add',this)">+ Add</button>
  <button class="tab-btn" onclick="switchTab('scores',this)">Scores</button>
  <button class="tab-btn" onclick="switchTab('subs',this)">Subscribers</button>
</div>
<div class="scroll-area">
  <div class="panel active" id="panel-matches">
    <div class="sec-hdr">
      <span class="sec-title">All Matches</span>
      <button class="sec-action" onclick="loadMatches()">Refresh</button>
    </div>
    <div class="match-list" id="match-list">
      <div class="loading"><div class="spinner"></div>Loading from Firebase...</div>
    </div>
  </div>
  <div class="panel" id="panel-add">
    <div class="form-card">
      <div class="form-title">Match Details</div>
      <div class="field-row">
        <div class="field"><label>Home Team</label><input type="text" id="f-home" placeholder="Arsenal"></div>
        <div class="field"><label>Away Team</label><input type="text" id="f-away" placeholder="Chelsea"></div>
      </div>
      <div class="field"><label>Competition</label><input type="text" id="f-comp" placeholder="Premier League"></div>
      <div class="field-row">
        <div class="field"><label>Date & Time</label><input type="datetime-local" id="f-date"></div>
        <div class="field"><label>Kick-off</label><input type="text" id="f-time" placeholder="20:00"></div>
      </div>
      <div class="field"><label>Status</label><select id="f-status"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="finished">Finished</option></select></div>
      <div class="field-row3">
        <div class="field"><label>Home Score</label><input type="number" id="f-hs" value="0" min="0"></div>
        <div class="field"><label>Away Score</label><input type="number" id="f-as" value="0" min="0"></div>
        <div class="field"><label>Minute</label><input type="number" id="f-min" placeholder="45"></div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-title">Stream Links</div>
      <div class="field"><label>Server 1 URL</label><input type="url" id="f-stream1" placeholder="https://..."></div>
      <div class="field-row">
        <div class="field"><label>Label</label><input type="text" id="f-label1" placeholder="Server 1"></div>
        <div class="field"><label>Type</label><select id="f-type1"><option value="iframe">iframe</option><option value="hls">HLS</option><option value="direct">Direct</option></select></div>
      </div>
      <div class="field"><label>Server 2 URL</label><input type="url" id="f-stream2" placeholder="https://..."></div>
      <div class="field"><label>Server 3 URL</label><input type="url" id="f-stream3" placeholder="https://..."></div>
    </div>
    <div class="form-card">
      <div class="form-title">Team Logos & Info</div>
      <div class="field-row">
        <div class="field"><label>Home Logo URL</label><input type="url" id="f-hlogo" placeholder="https://..."></div>
        <div class="field"><label>Away Logo URL</label><input type="url" id="f-alogo" placeholder="https://..."></div>
      </div>
      <div class="field"><label>Round / Matchday</label><input type="text" id="f-round" placeholder="Matchday 32"></div>
    </div>
    <button class="btn-primary" id="save-btn" onclick="saveMatch()">Save Match</button>
    <button class="btn-secondary" id="cancel-edit-btn" style="display:none" onclick="cancelEdit()">Cancel Edit</button>
  </div>
  <div class="panel" id="panel-scores">
    <div class="sec-hdr"><span class="sec-title">Update Scores</span></div>
    <div id="scores-list"><div class="loading"><div class="spinner"></div>Loading...</div></div>
  </div>
  <div class="panel" id="panel-subs">
    <div class="sec-hdr">
      <span class="sec-title">Subscribers</span>
      <button class="sec-action" onclick="loadSubs()">Refresh</button>
    </div>
    <div class="subs-list" id="subs-list"><div class="loading"><div class="spinner"></div>Loading...</div></div>
  </div>
</div>
<div class="dialog-bg" id="confirm-dialog">
  <div class="dialog">
    <h3 id="dialog-title">Are you sure?</h3>
    <p id="dialog-msg">This cannot be undone.</p>
    <div class="dialog-btns">
      <button class="dialog-cancel" onclick="closeDialog()">Cancel</button>
      <button class="dialog-confirm" id="dialog-confirm-btn">Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyC7DzEQEgpeyBcsUo_QaKl7faeYRer8e2E",authDomain:"instantlivefootball.firebaseapp.com",projectId:"instantlivefootball",storageBucket:"instantlivefootball.firebasestorage.app",messagingSenderId:"584488048641",appId:"1:584488048641:web:7adf83799426222a5fc800"};
try{if(localStorage.getItem("ft_admin_auth")!=="true")window.location.href="admin-login.html";}catch(e){}
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let _matches=[],editDocId=null,_dialogCb=null;
const g=id=>document.getElementById(id);
const gv=id=>g(id)?g(id).value:"";
let _tt;
function toast(msg,type){const t=g("toast");t.textContent=msg;t.className="toast show"+(type?" "+type:"");clearTimeout(_tt);_tt=setTimeout(()=>t.className="toast",2800);}
function showDialog(title,msg,cb){g("dialog-title").textContent=title;g("dialog-msg").textContent=msg;_dialogCb=cb;g("dialog-confirm-btn").onclick=()=>{closeDialog();if(_dialogCb)_dialogCb();};g("confirm-dialog").classList.add("open");}
function closeDialog(){g("confirm-dialog").classList.remove("open");}
function switchTab(name,el){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  g("panel-"+name).classList.add("active");
  if(el)el.classList.add("active");
  if(name==="scores")renderScores();
  if(name==="subs")loadSubs();
}
function loadMatches(){
  g("match-list").innerHTML="<div class='loading'><div class='spinner'></div>Loading...</div>";
  const timeout=setTimeout(()=>{g("match-list").innerHTML="<div class='empty'><div class='empty-icon'>⚠️</div><p>Firebase timeout. Check connection. <span onclick='loadMatches()' style='color:var(--g);cursor:pointer'>Retry</span></p></div>";},8000);
  db.collection("matches").get().then(snap=>{clearTimeout(timeout);
    _matches=[];
    snap.forEach(doc=>_matches.push({id:doc.id,...doc.data()}));
    updateStats();renderMatches();renderScores();
  }).catch(()=>{g("match-list").innerHTML="<div class='empty'><div class='empty-icon'>⚠️</div><p>Failed to load. <span onclick='loadMatches()' style='color:var(--g);cursor:pointer'>Retry</span></p></div>";});
}
function updateStats(){
  g("st-live").textContent=_matches.filter(m=>m.status==="live").length;
  g("st-upcoming").textContent=_matches.filter(m=>m.status==="upcoming").length;
  g("st-total").textContent=_matches.length;
}
function renderMatches(){
  const list=g("match-list");
  if(!_matches.length){list.innerHTML="<div class='empty'><div class='empty-icon'>📭</div><p>No matches yet. Add your first match.</p></div>";return;}
  const order={live:0,upcoming:1,finished:2};
  const sorted=[..._matches].sort((a,b)=>(order[a.status]??1)-(order[b.status]??1));
  list.innerHTML=sorted.map(m=>{
    const isLive=m.status==="live",isFt=m.status==="finished";
    return "<div class='mc'><div class='mc-top'><span class='mc-badge "+m.status+"'>"+(isLive?"<span class='live-dot'></span>":"")+m.status.toUpperCase()+"</span><span class='mc-comp'>"+(m.comp||"Football")+"</span><span class='mc-time'>"+(m.time||"")+"</span></div><div class='mc-body'><div class='mc-teams'><span class='mc-team'>"+(m.home||"?")+"</span><span class='mc-score-box'>"+(isLive||isFt?(m.hscore??0)+" - "+(m.ascore??0):"vs")+"</span><span class='mc-team right'>"+(m.away||"?")+"</span></div><div class='mc-actions'><button class='mc-btn edit-btn' onclick="editMatch('"+m.id+"')">Edit</button><button class='mc-btn live-btn' onclick="toggleStatus('"+m.id+"','"+m.status+"')">"+(isLive?"End Live":"Go Live")+"</button><button class='mc-btn' onclick="toggleHidden('"+m.id+"',"+!!m.hidden+")">"+(m.hidden?"Show":"Hide")+"</button><button class='mc-btn del-btn' onclick="deleteMatch('"+m.id+"','"+m.home+" vs "+m.away+"')">Delete</button></div></div></div>";
  }).join("");
}
function renderScores(){
  const list=g("scores-list");
  const live=_matches.filter(m=>m.status==="live"||m.status==="upcoming");
  if(!live.length){list.innerHTML="<div class='empty'><div class='empty-icon'>⚽</div><p>No live or upcoming matches</p></div>";return;}
  list.innerHTML=live.map(m=>"<div class='form-card' style='margin-bottom:10px'><div class='form-title' style='margin-bottom:10px'>"+m.home+" vs "+m.away+"</div><div class='score-editor'><span class='score-team'>"+m.home+"</span><div class='score-ctrl'><button class='score-minus' onclick="adjScore('"+m.id+"','h',-1)">-</button><span class='score-val' id='hs-"+m.id+"'>"+(m.hscore??0)+"</span><button class='score-plus' onclick="adjScore('"+m.id+"','h',1)">+</button></div><span style='color:var(--t3);flex-shrink:0'>vs</span><div class='score-ctrl'><button class='score-minus' onclick="adjScore('"+m.id+"','a',-1)">-</button><span class='score-val' id='as-"+m.id+"'>"+(m.ascore??0)+"</span><button class='score-plus' onclick="adjScore('"+m.id+"','a',1)">+</button></div><span class='score-team' style='text-align:right'>"+m.away+"</span></div><div class='field-row'><div class='field'><label>Minute</label><input type='number' id='min-"+m.id+"' value='"+(m.minute||"")+"' placeholder='45' style='text-align:center'></div><div class='field'><label>Status</label><select id='st-"+m.id+"'><option value='upcoming' "+(m.status==="upcoming"?"selected":"")+">Upcoming</option><option value='live' "+(m.status==="live"?"selected":"")+">Live</option><option value='finished' "+(m.status==="finished"?"selected":"")+">Finished</option></select></div></div><button class='btn-primary' style='margin-top:8px' onclick="pushScore('"+m.id+"')">Push Score</button></div>").join("");
}
function adjScore(id,side,delta){const m=_matches.find(x=>x.id===id);if(!m)return;if(side==="h"){m.hscore=Math.max(0,(m.hscore||0)+delta);g("hs-"+id).textContent=m.hscore;}else{m.ascore=Math.max(0,(m.ascore||0)+delta);g("as-"+id).textContent=m.ascore;}}
function pushScore(id){
  const m=_matches.find(x=>x.id===id);if(!m)return;
  const minute=parseInt(gv("min-"+id))||null,status=gv("st-"+id);
  db.collection("matches").doc(id).update({hscore:m.hscore||0,ascore:m.ascore||0,minute:minute,status:status}).then(()=>{m.minute=minute;m.status=status;toast("Score updated!","success");updateStats();}).catch(()=>toast("Failed","error"));
}
function saveMatch(){
  const home=gv("f-home").trim(),away=gv("f-away").trim();
  if(!home||!away){toast("Enter both team names","error");return;}
  const s1=gv("f-stream1").trim(),s2=gv("f-stream2").trim(),s3=gv("f-stream3").trim();
  const streams=[];
  if(s1)streams.push({url:s1,label:gv("f-label1").trim()||"Server 1",type:gv("f-type1")});
  if(s2)streams.push({url:s2,label:"Server 2",type:"iframe"});
  if(s3)streams.push({url:s3,label:"Server 3",type:"iframe"});
  const data={home,away,comp:gv("f-comp").trim(),date:gv("f-date"),time:gv("f-time").trim(),status:gv("f-status"),hscore:parseInt(gv("f-hs"))||0,ascore:parseInt(gv("f-as"))||0,minute:parseInt(gv("f-min"))||null,stream:s1,stream2:s2,stream3:s3,streamLabel:gv("f-label1").trim()||"Server 1",hlogo:gv("f-hlogo").trim(),alogo:gv("f-alogo").trim(),round:gv("f-round").trim(),hidden:false,streams:streams};
  const btn=g("save-btn");btn.textContent="Saving...";btn.disabled=true;
  const op=editDocId?db.collection("matches").doc(editDocId).update({...data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}):db.collection("matches").add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  op.then(()=>{toast(editDocId?"Match updated!":"Match added!","success");clearForm();loadMatches();switchTab("matches",g("tab-nav").querySelector(".tab-btn"));}).catch(err=>toast("Save failed: "+err.message,"error")).finally(()=>{btn.textContent="Save Match";btn.disabled=false;});
}
function editMatch(id){
  const m=_matches.find(x=>x.id===id);if(!m)return;
  editDocId=id;
  const sv=(fid,val)=>{const el=g(fid);if(el)el.value=val||"";};
  sv("f-home",m.home);sv("f-away",m.away);sv("f-comp",m.comp);sv("f-date",m.date);sv("f-time",m.time);sv("f-status",m.status);sv("f-hs",m.hscore??0);sv("f-as",m.ascore??0);sv("f-min",m.minute||"");sv("f-stream1",m.stream||m.streams?.[0]?.url||"");sv("f-stream2",m.stream2||m.streams?.[1]?.url||"");sv("f-stream3",m.stream3||m.streams?.[2]?.url||"");sv("f-label1",m.streamLabel||"Server 1");sv("f-hlogo",m.hlogo);sv("f-alogo",m.alogo);sv("f-round",m.round);
  g("save-btn").textContent="Update Match";g("cancel-edit-btn").style.display="block";
  switchTab("add",document.querySelectorAll(".tab-btn")[1]);
  toast("Editing: "+m.home+" vs "+m.away);
}
function cancelEdit(){editDocId=null;clearForm();g("save-btn").textContent="Save Match";g("cancel-edit-btn").style.display="none";}
function clearForm(){["f-home","f-away","f-comp","f-date","f-time","f-min","f-stream1","f-stream2","f-stream3","f-label1","f-hlogo","f-alogo","f-round"].forEach(id=>{const el=g(id);if(el)el.value="";});g("f-hs").value="0";g("f-as").value="0";g("f-status").value="upcoming";g("f-type1").value="iframe";editDocId=null;}
function toggleStatus(id,current){const ns=current==="live"?"finished":"live";db.collection("matches").doc(id).update({status:ns}).then(()=>{toast("Status: "+ns,"success");loadMatches();}).catch(()=>toast("Failed","error"));}
function toggleHidden(id,hidden){db.collection("matches").doc(id).update({hidden:!hidden}).then(()=>{toast(!hidden?"Hidden":"Visible","success");loadMatches();}).catch(()=>toast("Failed","error"));}
function deleteMatch(id,name){showDialog("Delete match?",name+" will be permanently deleted.",()=>{db.collection("matches").doc(id).delete().then(()=>{toast("Deleted","success");loadMatches();}).catch(()=>toast("Delete failed","error"));});}
function loadSubs(){
  g("subs-list").innerHTML="<div class='loading'><div class='spinner'></div>Loading...</div>";
  db.collection("subscribers").get().then(snap=>{
    const subs=[];snap.forEach(doc=>subs.push({id:doc.id,...doc.data()}));
    g("st-subs").textContent=subs.length;
    if(!subs.length){g("subs-list").innerHTML="<div class='empty'><div class='empty-icon'>👥</div><p>No subscribers yet</p></div>";return;}
    g("subs-list").innerHTML=subs.map(s=>"<div class='sub-row'><span class='sub-email'>"+(s.email||s.id)+"</span><span class='sub-plan'>"+(s.plan||"PRO")+"</span></div>").join("");
  }).catch(()=>{g("subs-list").innerHTML="<div class='empty'><p>Failed to load</p></div>";});
}
function logout(){showDialog("Log out?","You will be returned to the login page.",()=>{try{localStorage.removeItem("ft_admin_auth");}catch(e){}window.location.href="admin-login.html";});}
g("tb-date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
loadMatches();
</script>
</body>
</html>
