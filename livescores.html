<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,53,53,.12);border:1px solid rgba(255,53,53,.3);border-radius:10px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;color:var(--live);margin-left:8px}
.refresh-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:6px 12px;color:var(--g);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1px;cursor:pointer}
.filter-tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;white-space:nowrap}
.ftab.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.content{padding:10px 14px}
.match-group{margin-bottom:14px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr img{width:18px;height:18px;object-fit:contain;border-radius:50%}
.group-hdr-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.score-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all .15s;cursor:pointer}
.score-card:hover,.score-card.has-stream{border-color:rgba(0,233,107,.3)}
.sc-status{min-width:40px;text-align:center;flex-shrink:0}
.sc-live{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.sc-ft{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--t3)}
.sc-time{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--gold)}
.sc-teams{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.sc-team-row{display:flex;align-items:center;gap:7px}
.sc-crest{width:20px;height:20px;object-fit:contain;flex-shrink:0;border-radius:50%}
.sc-tname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.86rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.sc-play{font-size:.7rem;color:var(--g);font-family:'Barlow Condensed',sans-serif;font-weight:700}
.stream-tag{background:rgba(0,233,107,.1);border:1px solid rgba(0,233,107,.25);border-radius:4px;padding:1px 5px;font-family:'Barlow Condensed',sans-serif;font-size:.58rem;color:var(--g);font-weight:700}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:30px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;line-height:1.8}
.source-bar{padding:5px 14px;background:rgba(0,233,107,.05);border-bottom:1px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3);display:flex;align-items:center;gap:6px}
.source-dot{width:5px;height:5px;border-radius:50%;background:var(--g);flex-shrink:0}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>

<div class="filter-tabs">
  <button class="ftab active" onclick="filterCat('all',this)">All Sports</button>
  <button class="ftab" onclick="filterCat('football',this)">⚽ Football</button>
  <button class="ftab" onclick="filterCat('basketball',this)">🏀 Basketball</button>
  <button class="ftab" onclick="filterCat('tennis',this)">🎾 Tennis</button>
  <button class="ftab" onclick="filterCat('other',this)">More</button>
</div>
<div class="content" id="scores-content">
  <div class="loading-state"><div class="spinner"></div><span>Fetching live streams…</span></div>
</div>

  <a class="bn-item" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>
<script>
// PPV.to API — works directly, no proxy needed
const PPV_API = 'https://ppv.to/api/streams';
// Backup sources
const BACKUP_APIS = [
  'https://holy-band-6142.herdeking.workers.dev/live',
];

let allStreams=[], catFilter='all';

const CAT_MAP = {
  football: ['football','soccer','liga','premier','serie','bundesliga','champions','europa','ligue','laliga','calcio','futbol','fa cup','coppa','dfb','eredivisie','primera','super lig'],
  basketball: ['basketball','nba','nbl','euroleague','bbl','bsn'],
  tennis: ['tennis','atp','wta','wimbledon','roland','us open','australian'],
};

function getCategory(catName){
  const n=(catName||'').toLowerCase();
  for(const [key,words] of Object.entries(CAT_MAP)){
    if(words.some(w=>n.includes(w))) return key;
  }
  return 'other';
}

function filterCat(cat,btn){
  catFilter=cat;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderStreams();
}

async function loadAll(){
  document.getElementById('scores-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Fetching live streams…</span></div>';
  document.getElementById('last-updated').textContent='Updating…';

  // Try PPV.to first
  let data = await fetchPPV();

  // Try backup if PPV fails
  if(!data){
    for(const url of BACKUP_APIS){
      try{
        const res=await fetch(url);
        if(res.ok){ data=await res.json(); break; }
      }catch(e){}
    }
  }

  if(!data){
    document.getElementById('scores-content').innerHTML=`<div class="empty">Could not load live streams.<br><br><button onclick="loadAll()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer">Retry</button></div>`;
    document.getElementById('last-updated').textContent='Failed — tap Retry';
    return;
  }

  // Parse PPV.to response
  allStreams=[];
  const now=Date.now()/1000;
  (data.streams||[]).forEach(cat=>{
    (cat.streams||[]).forEach(s=>{
      const isLive=s.always_live===1||(s.starts_at&&s.starts_at<=now&&(s.ends_at===0||s.ends_at>now));
      const isUpcoming=s.starts_at&&s.starts_at>now&&s.starts_at<now+86400;
      if(!isLive&&!isUpcoming) return;
      allStreams.push({
        id:s.id,
        name:s.name||'Unknown',
        category:cat.category||'Other',
        catType:getCategory(cat.category),
        poster:s.poster||'',
        starts_at:s.starts_at||0,
        ends_at:s.ends_at||0,
        always_live:s.always_live||0,
        uri_name:s.uri_name||'',
        iframe:s.iframe||'',
        isLive:isLive,
        isUpcoming:isUpcoming,
      });
    });
  });

  // Sort: live first then upcoming
  allStreams.sort((a,b)=>a.isLive===b.isLive?0:a.isLive?-1:1);

  const liveCount=allStreams.filter(s=>s.isLive).length;
  document.getElementById('live-num').textContent=liveCount;
  document.getElementById('live-badge').style.display=liveCount>0?'inline-flex':'none';
  document.getElementById('last-updated').textContent=`Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${allStreams.length} streams`;
  document.getElementById('source-label').textContent=`PPV.to · ${liveCount} live · ${allStreams.filter(s=>s.isUpcoming).length} upcoming`;

  renderStreams();
}

async function fetchPPV(){
  try{
    const res=await fetch(PPV_API,{headers:{'Accept':'application/json'}});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){return null;}
}

function renderStreams(){
  let filtered=allStreams;
  if(catFilter!=='all') filtered=allStreams.filter(s=>s.catType===catFilter);

  if(!filtered.length){
    document.getElementById('scores-content').innerHTML='<div class="empty">No live streams for this category right now</div>';
    return;
  }

  // Group by category
  const groups={};
  filtered.forEach(s=>{
    if(!groups[s.category]) groups[s.category]=[];
    groups[s.category].push(s);
  });

  let html='';
  Object.entries(groups).forEach(([cat,streams])=>{
    html+=`<div class="match-group">
    <div class="group-hdr">
      <span style="font-size:1rem">${getCatEmoji(cat)}</span>
      <span class="group-hdr-name">${cat}</span>
      <span style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3)">${streams.length}</span>
    </div>`;
    streams.forEach(s=>{
      const vs=s.name.match(/^(.+?)\s+(?:vs?\.?|–|-)\s+(.+?)(\s+\[.*\])?$/i);
      const home=vs?vs[1].trim():s.name;
      const away=vs?vs[2]?.trim():'';
      const now=Date.now()/1000;
      const minutesUntil=s.starts_at?Math.round((s.starts_at-now)/60):0;
      const timeLabel=s.isLive?'LIVE':minutesUntil<=60?`in ${minutesUntil}m`:new Date(s.starts_at*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'});
      const streamUrl=s.uri_name?`https://ppv.to/streams/${s.uri_name}`:'';

      html+=`<div class="score-card ${s.isLive?'has-stream':''}" onclick="${streamUrl?`window.open('${streamUrl}','_blank')`:''}">
        <div class="sc-status">
          ${s.isLive?`<div class="sc-live"><span class="ldot"></span><span style="font-size:.6rem">LIVE</span></div>`:`<div class="sc-time" style="font-size:.8rem">${timeLabel}</div>`}
        </div>
        <div class="sc-teams">
          <div class="sc-team-row">
            ${s.poster?`<img class="sc-crest" src="${s.poster}" onerror="this.style.display='none'">`:'<div style="width:20px;height:20px;border-radius:50%;background:var(--s2);flex-shrink:0"></div>'}
            <span class="sc-tname" style="font-size:.9rem">${home}</span>
          </div>
          ${away?`<div class="sc-team-row"><div style="width:20px;height:20px;border-radius:50%;background:var(--s3);flex-shrink:0"></div><span class="sc-tname" style="color:var(--t2)">${away}</span></div>`:''}
        </div>
        <div class="sc-right">
          ${s.isLive?`<span class="stream-tag">▶ Watch</span>`:''}
        </div>
      </div>`;
    });
    html+='</div>';
  });

  document.getElementById('scores-content').innerHTML=html;
}

function getCatEmoji(cat){
  const n=(cat||'').toLowerCase();
  if(n.includes('football')||n.includes('soccer')||n.includes('liga')||n.includes('premier')||n.includes('serie')||n.includes('bundesliga')||n.includes('champions')||n.includes('europa')||n.includes('calcio')) return '⚽';
  if(n.includes('basketball')||n.includes('nba')) return '🏀';
  if(n.includes('tennis')) return '🎾';
  if(n.includes('boxing')||n.includes('mma')||n.includes('ufc')) return '🥊';
  if(n.includes('rugby')) return '🏉';
  if(n.includes('cricket')) return '🏏';
  if(n.includes('baseball')) return '⚾';
  if(n.includes('hockey')) return '🏒';
  if(n.includes('golf')) return '⛳';
  if(n.includes('motor')||n.includes('f1')||n.includes('racing')) return '🏎️';
  return '🏆';
}

loadAll();
setInterval(loadAll, 60000);
</script>
