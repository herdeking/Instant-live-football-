<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--s3:#1a2330;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;gap:2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px 14px 10px;border-bottom:1px solid var(--bd)}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.league-tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.league-tabs::-webkit-scrollbar{display:none}
.ltab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ltab img{width:14px;height:14px;object-fit:contain;border-radius:50%}
.ltab.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.ltab:hover:not(.active){border-color:var(--g);color:var(--g)}
.content{padding:10px 14px}
.date-strip{display:flex;overflow-x:auto;gap:6px;margin-bottom:12px;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.date-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:52px}
.date-btn .day{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase}
.date-btn .num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;line-height:1}
.date-btn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.match-group{margin-bottom:14px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr img{width:18px;height:18px;object-fit:contain;border-radius:50%}
.group-hdr span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.score-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:all .15s;display:grid;grid-template-columns:60px 1fr auto 1fr 60px;align-items:center;gap:8px}
.score-card:hover{border-color:var(--g);background:var(--s2)}
.sc-status{text-align:center}
.sc-live{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.sc-live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.sc-ft{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--t3)}
.sc-time{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--gold)}
.sc-team{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.sc-team.home{align-items:flex-end;text-align:right}
.sc-team.away{align-items:flex-start;text-align:left}
.sc-crest{width:32px;height:32px;object-fit:contain}
.sc-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.3px;line-height:1.2;color:var(--t1)}
.sc-name.dim{color:var(--t3)}
.sc-scores{display:flex;align-items:center;gap:4px;justify-content:center}
.sc-score{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;color:var(--t1);line-height:1}
.sc-score.dim{color:var(--t3)}
.sc-sep{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--t3)}
.sc-vs{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--t3);letter-spacing:2px}
.loading-state{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;letter-spacing:.5px}
.spinner{width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:40px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
.refresh-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:5px 10px;color:var(--g);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-left:auto}
.live-indicator{display:inline-flex;align-items:center;gap:4px;background:rgba(255,53,53,.12);border:1px solid rgba(255,53,53,.3);border-radius:10px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;letter-spacing:1.5px;color:var(--live);margin-left:8px}
</style>
</head>

<div class="page-header">
  <div style="display:flex;align-items:center">
    <div>
      <div class="page-title">Live Scores</div>
      <div class="page-sub" id="last-updated">Updating…</div>
    </div>
    <div id="live-count-badge" class="live-indicator" style="display:none"><span class="sc-live-dot"></span><span id="live-num">0</span> Live</div>
    <button class="refresh-btn" onclick="loadScores()">↻ Refresh</button>
  </div>
</div>

<div class="date-strip" id="date-strip"></div>

<div class="league-tabs" id="league-tabs">
  <button class="ltab active" onclick="filterLeague('all',this)">All</button>
</div>

<div class="content" id="scores-content">
  <div class="loading-state"><div class="spinner"></div><span>Loading scores…</span></div>
</div>

<nav class="bottom-nav">

  <a class="bn-item active" href="livescores.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg><span>Scores</span></a>
  <a class="bn-item" href="fixtures.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Fixtures</span></a>
  <a class="bn-item" href="standings.html"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Standings</span></a>
</nav>

<script>
const LB='https://media.api-sports.io/football/leagues/';
const TB='https://media.api-sports.io/football/teams/';

const LEAGUE_LOGOS={
  'Premier League':LB+'39.png','La Liga':LB+'140.png','Serie A':LB+'135.png',
  'Bundesliga':LB+'78.png','Ligue 1':LB+'61.png','Champions League':LB+'2.png',
  'Europa League':LB+'3.png','Conference League':LB+'848.png','FA Cup':LB+'45.png',
  'Championship':LB+'40.png','Eredivisie':LB+'88.png','Liga Portugal':LB+'94.png',
  'Super Lig':LB+'203.png','Saudi Pro League':LB+'307.png','MLS':LB+'253.png',
  'NPFL':LB+'335.png','Scottish Premiership':LB+'179.png'
};

const TEAM_LOGOS={
  'Arsenal':TB+'42.png','Manchester City':TB+'50.png','Liverpool':TB+'40.png',
  'Chelsea':TB+'49.png','Tottenham':TB+'47.png','Manchester United':TB+'33.png',
  'Newcastle':TB+'34.png','Aston Villa':TB+'66.png','Real Madrid':TB+'541.png',
  'Barcelona':TB+'529.png','Atletico Madrid':TB+'530.png','Juventus':TB+'496.png',
  'AC Milan':TB+'489.png','Inter':TB+'505.png','Napoli':TB+'492.png',
  'Bayern Munich':TB+'157.png','Dortmund':TB+'165.png','PSG':TB+'85.png',
};

function getTeamLogo(name){
  return TEAM_LOGOS[name]||`https://ui-avatars.com/api/?name=${encodeURIComponent(name||'?')}&background=131920&color=00e96b&size=40&bold=true&font-size=0.4`;
}
function getLeagueLogo(name){
  return LEAGUE_LOGOS[name]||`https://ui-avatars.com/api/?name=${encodeURIComponent((name||'').substring(0,2))}&background=1a2330&color=8a9ab0&size=30&bold=true`;
}

let allMatches=[], selectedDate=getTodayStr(), selectedLeague='all';
let autoRefreshTimer=null;

function getTodayStr(){
  const d=new Date();
  return d.toISOString().split('T')[0];
}

function buildDateStrip(){
  const strip=document.getElementById('date-strip');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html='';
  for(let i=-2;i<=4;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const str=d.toISOString().split('T')[0];
    const label=i===0?'Today':i===-1?'Yest':i===1?'Tom':days[d.getDay()];
    const num=d.getDate();
    html+=`<button class="date-btn${str===selectedDate?' active':''}" onclick="selectDate('${str}',this)">
      <div class="day">${label}</div>
      <div class="num">${num}</div>
    </button>`;
  }
  strip.innerHTML=html;
}

function selectDate(date,btn){
  selectedDate=date;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  loadScores();
}

async function loadScores(){
  document.getElementById('scores-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Loading scores…</span></div>';
  document.getElementById('last-updated').textContent='Updating…';

  try{
    // Use Sofascore free API
    const res=await fetch(`https://api.sofascore.com/api/v1/sport/football/scheduled-events/${selectedDate}`);
    if(!res.ok) throw new Error('API error');
    const data=await res.json();
    allMatches=data.events||[];
    renderScores();
    buildLeagueTabs();
    const count=allMatches.filter(m=>m.status?.type==='inprogress').length;
    const badge=document.getElementById('live-count-badge');
    document.getElementById('live-num').textContent=count;
    badge.style.display=count>0?'inline-flex':'none';
    document.getElementById('last-updated').textContent='Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('scores-content').innerHTML=`<div class="empty">Could not load scores.<br><button onclick="loadScores()" style="background:var(--g);color:var(--bg);border:none;border-radius:5px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;margin-top:10px">Retry</button></div>`;
  }
}

function buildLeagueTabs(){
  const leagues=[...new Set(allMatches.map(m=>m.tournament?.name).filter(Boolean))].slice(0,12);
  const tabs=document.getElementById('league-tabs');
  tabs.innerHTML=`<button class="ltab${selectedLeague==='all'?' active':''}" onclick="filterLeague('all',this)">All</button>`;
  leagues.forEach(l=>{
    tabs.innerHTML+=`<button class="ltab${selectedLeague===l?' active':''}" onclick="filterLeague('${l.replace(/'/g,'\\'')}',this)">
      <img src="${getLeagueLogo(l)}" onerror="this.style.display='none'">${l}
    </button>`;
  });
}

function filterLeague(league,btn){
  selectedLeague=league;
  document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderScores();
}

function renderScores(){
  let filtered=allMatches;
  if(selectedLeague!=='all') filtered=allMatches.filter(m=>m.tournament?.name===selectedLeague);

  if(!filtered.length){
    document.getElementById('scores-content').innerHTML='<div class="empty">No matches found for this selection</div>';
    return;
  }

  // Group by tournament
  const groups={};
  filtered.forEach(m=>{
    const t=m.tournament?.name||'Football';
    if(!groups[t]) groups[t]=[];
    groups[t].push(m);
  });

  // Sort: live first, then by time
  const sortMatches=arr=>[...arr].sort((a,b)=>{
    const aLive=a.status?.type==='inprogress'?0:1;
    const bLive=b.status?.type==='inprogress'?0:1;
    if(aLive!==bLive) return aLive-bLive;
    return (a.startTimestamp||0)-(b.startTimestamp||0);
  });

  let html='';
  Object.entries(groups).forEach(([league,matches])=>{
    html+=`<div class="match-group">
    <div class="group-hdr">
      <img src="${getLeagueLogo(league)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(league.substring(0,2))}&background=1a2330&color=8a9ab0&size=30'">
      <span>${league}</span>
    </div>`;
    sortMatches(matches).forEach(m=>{
      const hs=m.homeScore?.current??'';
      const as_=m.awayScore?.current??'';
      const st=m.status?.type;
      const min=m.time?.played;
      const isLive=st==='inprogress';
      const isFt=st==='finished';
      const kickoff=m.startTimestamp?new Date(m.startTimestamp*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}):'';
      const hWin=isFt&&hs>as_;
      const aWin=isFt&&as_>hs;
      html+=`<div class="score-card" onclick="window.location.href='index.html'">
        <div class="sc-team home">
          <img class="sc-crest" src="${getTeamLogo(m.homeTeam?.name)}" alt="${m.homeTeam?.name||''}" onerror="this.src='${getTeamLogo(m.homeTeam?.name)}'">
          <div class="sc-name${aWin?' dim':''}">${m.homeTeam?.name||''}</div>
        </div>
        <div class="sc-scores">
          ${isLive||isFt
            ?`<span class="sc-score${aWin?' dim':''}">${hs}</span><span class="sc-sep">–</span><span class="sc-score${hWin?' dim':''}">${as_}</span>`
            :`<span class="sc-vs">${kickoff||'TBC'}</span>`}
        </div>
        <div class="sc-status">
          ${isLive?`<div class="sc-live"><span class="sc-live-dot"></span><span>${min?min+"'":''}</span></div>`:isFt?`<div class="sc-ft">FT</div>`:`<div class="sc-time">${kickoff}</div>`}
        </div>
        <div class="sc-scores">
        </div>
        <div class="sc-team away">
          <img class="sc-crest" src="${getTeamLogo(m.awayTeam?.name)}" alt="${m.awayTeam?.name||''}" onerror="this.src='${getTeamLogo(m.awayTeam?.name)}'">
          <div class="sc-name${hWin?' dim':''}">${m.awayTeam?.name||''}</div>
        </div>
      </div>`;
    });
    html+='</div>';
  });

  document.getElementById('scores-content').innerHTML=html;
}

// Init
buildDateStrip();
loadScores();
// Auto refresh every 60 seconds
autoRefreshTimer=setInterval(loadScores, 60000);
</script>
</body>
</html>
