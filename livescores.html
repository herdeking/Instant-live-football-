<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#00e96b;--red:#ff3535;--gold:#ffc107;--bg:#07090a;--s1:#0d1117;--s2:#131920;--bd:#1e2d3d;--t1:#e8edf2;--t2:#8a9ab0;--t3:#4a5a6a;--live:#ff3535}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding-bottom:70px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(7,9,10,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--g);text-decoration:none}
.nav-logo span{color:var(--t1)}
.nav-links{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);text-decoration:none;padding:0 10px;height:54px;display:flex;align-items:center;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-links a.active,.nav-links a:hover{color:var(--t1);border-bottom-color:var(--g)}
.page-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px}
.page-sub{font-size:.75rem;color:var(--t3);font-family:'Barlow Condensed',sans-serif;margin-top:2px}
.refresh-btn{background:none;border:1px solid var(--bd);border-radius:6px;padding:6px 12px;color:var(--g);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;cursor:pointer}
.date-strip{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.date-strip::-webkit-scrollbar{display:none}
.date-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;min-width:52px}
.date-btn .day{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase}
.date-btn .num{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;line-height:1}
.date-btn.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.ftabs{display:flex;overflow-x:auto;gap:6px;padding:8px 14px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .2s;white-space:nowrap}
.ftab.active{background:var(--g);border-color:var(--g);color:var(--bg)}
.ftab:hover:not(.active){border-color:var(--g);color:var(--g)}
.content{padding:10px 14px}
.match-group{margin-bottom:14px}
.group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:6px}
.group-hdr img{width:18px;height:18px;object-fit:contain;border-radius:50%}
.group-hdr-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--t2)}
.score-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all .15s}
.score-card:hover{border-color:var(--g);background:var(--s2)}
.sc-status{min-width:40px;text-align:center;flex-shrink:0}
.sc-live{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;color:var(--live);display:flex;flex-direction:column;align-items:center;gap:2px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.1s ease-in-out infinite;display:block;margin:0 auto}
.sc-ft{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--t3)}
.sc-time{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:1px;color:var(--gold)}
.sc-teams{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.sc-team-row{display:flex;align-items:center;gap:7px}
.sc-crest{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.sc-tname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.86rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-tname.dim{color:var(--t3)}
.sc-tscore{font-family:'Bebas Neue',sans-serif;font-size:1rem;min-width:14px;text-align:right;flex-shrink:0}
.sc-tscore.win{color:var(--t1);font-size:1.1rem}
.sc-tscore.lose{color:var(--t3)}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:30px 16px;color:var(--t3);font-family:'Barlow Condensed',sans-serif;font-size:.85rem;line-height:1.8}
.setup-card{background:var(--s2);border:1px solid rgba(0,233,107,.25);border-radius:10px;padding:16px;margin:10px 0}
.setup-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--g);margin-bottom:10px}
.setup-step{font-size:.8rem;color:var(--t2);line-height:2;font-family:'Barlow Condensed',sans-serif}
.setup-step strong{color:var(--t1)}
.setup-url{background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:7px 10px;font-family:monospace;font-size:.75rem;color:#4fc3f7;word-break:break-all;margin:6px 0;display:block}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,53,53,.12);border:1px solid rgba(255,53,53,.3);border-radius:10px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;color:var(--live);margin-left:8px}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,18,.98);border-top:1px solid var(--bd);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:601px){.bottom-nav{display:none}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;cursor:pointer;text-decoration:none}
.bn-item svg{width:22px;height:22px;fill:none;stroke:var(--t3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.55rem;letter-spacing:1px;text-transform:uppercase;color:var(--t3)}
.bn-item.active svg{stroke:var(--g)}
.bn-item.active span{color:var(--g)}
</style>
</head>

      <div class="page-title">Live Scores</div>

<script>
// =====================================================
// MULTIPLE API SERVERS — Tries each in order until one works
// Replace REPLACE_ME_1 and REPLACE_ME_2 with your worker names
// =====================================================
const API_SERVERS = [
  { name: 'PPV.to',       type: 'ppv', url: 'https://ppv.to/api/streams' },
  { name: 'Worker-1',     type: 'worker', url: 'https://fulltime-proxy.REPLACE_ME_1.workers.dev' },
  { name: 'Worker-2',     type: 'worker', url: 'https://fulltime-proxy.REPLACE_ME_2.workers.dev' },
  { name: 'Football-Data',type: 'fd', url: 'https://api.football-data.org/v4', key: '6e26ab7db1044d37bd7b0a94a6c06f1c' },
];
const LB = 'https://media.api-sports.io/football/leagues/';
const COMP_LOGOS = {'PL':LB+'39.png','PD':LB+'140.png','SA':LB+'135.png','BL1':LB+'78.png','FL1':LB+'61.png','CL':LB+'2.png','EL':LB+'3.png','ELC':LB+'40.png','DED':LB+'88.png','PPL':LB+'94.png'};

function getCompLogo(code){return COMP_LOGOS[code]||`https://ui-avatars.com/api/?name=${encodeURIComponent(code||'?')}&background=1a2330&color=8a9ab0&size=30`;}

let allMatches=[], selectedDate=new Date().toISOString().split('T')[0], statusFilter='all';

function buildDateStrip(){
  const strip=document.getElementById('date-strip');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html='';
  for(let i=-2;i<=4;i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const str=d.toISOString().split('T')[0];
    const label=i===0?'Today':i===-1?'Yest':i===1?'Tom':days[d.getDay()];
    html+=`<button class="date-btn${str===selectedDate?' active':''}" onclick="selectDate('${str}',this)"><div class="day">${label}</div><div class="num">${d.getDate()}</div></button>`;
  }
  strip.innerHTML=html;
}

function selectDate(date,btn){
  selectedDate=date;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  loadScores();
}

function filterStatus(s,btn){
  statusFilter=s;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderMatches();
}

async function fetchFromServers(date){
  for(const server of API_SERVERS){
    if(server.url.includes('REPLACE_ME')) continue;
    try{
      let url, headers={};
      if(server.type==='ppv'){
        // PPV.to — shows live streams only
        const res=await fetch(server.url);
        if(!res.ok) continue;
        const data=await res.json();
        const matches=[];
        const now=Date.now()/1000;
        (data.streams||[]).forEach(cat=>{
          const isFootball=cat.category?.toLowerCase().match(/football|soccer|liga|premier|serie|bundesliga|champions|europa|ligue/);
          if(!isFootball) return;
          (cat.streams||[]).forEach(s=>{
            const isLive=s.always_live===1||(s.starts_at&&s.starts_at<=now&&(s.ends_at===0||s.ends_at>now));
            if(!isLive) return;
            const vs=s.name.match(/^(.+?)\s+(?:vs?\.?|–|-)\s+(.+?)(\s+\[|$)/i);
            matches.push({
              id:s.id,
              homeTeam:{name:vs?vs[1].trim():s.name,shortName:vs?vs[1].trim():s.name,crest:''},
              awayTeam:{name:vs?vs[2]?.trim()||'':s.name,shortName:vs?vs[2]?.trim()||'':'',crest:''},
              competition:{name:cat.category||'Football',code:''},
              status:'IN_PLAY',
              utcDate:s.starts_at?new Date(s.starts_at*1000).toISOString():new Date().toISOString(),
              score:{fullTime:{home:null,away:null},halfTime:{home:null,away:null}},
              hasStream:true,
            });
          });
        });
        if(matches.length){
          showApiSource(server.name);
          return matches;
        }
        continue;
      } else if(server.type==='worker'){
        url=`${server.url}/matches?date=${date}`;
      } else if(server.type==='fd'){
        url=`${server.url}/matches?dateFrom=${date}&dateTo=${date}`;
        headers={'X-Auth-Token':server.key};
      }
      const res=await fetch(url,{headers});
      if(!res.ok) continue;
      const json=await res.json();
      if(json.matches){
        showApiSource(server.name);
        return json.matches;
      }
    }catch(e){ continue; }
  }
  return null;
}

function showApiSource(name){
  // Silently log which server worked
  console.log('Using API server:', name);
}

async function loadScores(){
  document.getElementById('scores-content').innerHTML='<div class="loading-state"><div class="spinner"></div><span>Loading scores…</span></div>';
  document.getElementById('last-updated').textContent='Updating…';
  try{
    const matches=await fetchFromServers(selectedDate);
    if(!matches) throw new Error('All servers failed');
    allMatches=matches;
    renderMatches();
    const live=allMatches.filter(m=>m.status==='IN_PLAY'||m.status==='PAUSED').length;
    document.getElementById('live-num').textContent=live;
    document.getElementById('live-badge').style.display=live>0?'inline-flex':'none';
    document.getElementById('last-updated').textContent=`Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${allMatches.length} matches`;
  }catch(e){showSetupInstructions();}
}

function renderMatches(){
  let filtered=allMatches;
  if(statusFilter==='live')filtered=allMatches.filter(m=>m.status==='IN_PLAY'||m.status==='PAUSED');
  else if(statusFilter==='finished')filtered=allMatches.filter(m=>m.status==='FINISHED');
  else if(statusFilter==='upcoming')filtered=allMatches.filter(m=>m.status==='SCHEDULED'||m.status==='TIMED');
  if(!filtered.length){document.getElementById('scores-content').innerHTML='<div class="empty">No matches found for this filter</div>';return;}
  const groups={};
  filtered.forEach(m=>{const k=m.competition?.name||'Football';if(!groups[k])groups[k]={code:m.competition?.code||'',matches:[]};groups[k].matches.push(m);});
  const order={'IN_PLAY':0,'PAUSED':1,'FINISHED':2,'SCHEDULED':3,'TIMED':3};
  let html='';
  Object.entries(groups).forEach(([league,{code,matches}])=>{
    html+=`<div class="match-group"><div class="group-hdr"><img src="${getCompLogo(code)}" onerror="this.style.display='none'"><span class="group-hdr-name">${league}</span><span style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;color:var(--t3)">${matches.length}</span></div>`;
    matches.sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)).forEach(m=>{
      const isLive=m.status==='IN_PLAY'||m.status==='PAUSED';
      const isFt=m.status==='FINISHED';
      const hs=m.score?.fullTime?.home??m.score?.halfTime?.home??'';
      const as_=m.score?.fullTime?.away??m.score?.halfTime?.away??'';
      const kickoff=m.utcDate?new Date(m.utcDate).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}):'';
      const hWin=isFt&&hs!==''&&hs>as_;const aWin=isFt&&as_!==''&&as_>hs;
      const hLogo=m.homeTeam?.crest||`https://crests.football-data.org/${m.homeTeam?.id}.png`;
      const aLogo=m.awayTeam?.crest||`https://crests.football-data.org/${m.awayTeam?.id}.png`;
      html+=`<div class="score-card">
        <div class="sc-status">${isLive?`<div class="sc-live"><span class="ldot"></span><span>${m.minute?m.minute+"'":''}</span></div>`:isFt?`<div class="sc-ft">FT</div>`:`<div class="sc-time">${kickoff}</div>`}</div>
        <div class="sc-teams">
          <div class="sc-team-row"><img class="sc-crest" src="${hLogo}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent((m.homeTeam?.shortName||'?').substring(0,2))}&background=131920&color=00e96b&size=40'"><span class="sc-tname${aWin?' dim':''}">${m.homeTeam?.shortName||m.homeTeam?.name||''}</span>${isLive||isFt?`<span class="sc-tscore${hWin?' win':aWin?' lose':''}">${hs}</span>`:''}</div>
          <div class="sc-team-row"><img class="sc-crest" src="${aLogo}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent((m.awayTeam?.shortName||'?').substring(0,2))}&background=131920&color=00e96b&size=40'"><span class="sc-tname${hWin?' dim':''}">${m.awayTeam?.shortName||m.awayTeam?.name||''}</span>${isLive||isFt?`<span class="sc-tscore${aWin?' win':hWin?' lose':''}">${as_}</span>`:''}</div>
        </div>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('scores-content').innerHTML=html;
}

function showSetupInstructions(){
  document.getElementById('scores-content').innerHTML=`
  <div class="setup-card">
    <div class="setup-title">⚙️ Free Setup Required — 5 Minutes</div>
    <div class="setup-step">
    <strong>Step 1:</strong> Go to <strong>workers.cloudflare.com</strong> — sign up FREE<br>
    <strong>Step 2:</strong> Click <strong>Create Worker → Edit Code</strong><br>
    <strong>Step 3:</strong> Upload/paste the <strong>cloudflare-worker.js</strong> file from our chat<br>
    <strong>Step 4:</strong> Click <strong>Deploy</strong><br>
    <strong>Step 5:</strong> Copy your worker URL (like below)<br>
    <strong>Step 6:</strong> In livescores.html, fixtures.html & standings.html replace:<br>
    </div>
    <code class="setup-url">REPLACE_ME → your-worker-name</code>
    <div class="setup-step" style="margin-top:8px">✅ <strong style="color:var(--g)">100,000 free requests/day</strong> — more than enough!</div>
  </div>
  <div class="empty">Your admin-managed matches are still visible on the <a href="index.html" style="color:var(--g)">Home page</a></div>`;
  document.getElementById('last-updated').textContent='Setup needed';
}

buildDateStrip();
loadScores();
setInterval(loadScores,60000);
</script>
